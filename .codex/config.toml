[skills]
include_instructions = true
# Keep the large repository skill catalog visible within Codex's 10,000-token cap.
max_context_tokens = 10000

[skills.bundled]
enabled = true

[[skills.config]]
# Match the installed skill without tying the selector to a checkout location.
name = "openai-docs"
enabled = true

[[skills.config]]
name = "shadcn"
enabled = true

[[skills.config]]
name = "frontend-design"
enabled = true

[[skills.config]]
name = "web-design-guidelines"
enabled = true

[[skills.config]]
name = "vercel-react-best-practices"
enabled = true

[[skills.config]]
name = "next-dev-loop"
enabled = true

[[skills.config]]
name = "graphify"
enabled = true

[[skills.config]]
name = "repomix-explorer"
enabled = true

[[skills.config]]
name = "repomix-reference-line-mini-app-bot"
enabled = true

[[skills.config]]
name = "context7-mcp"
enabled = true

[[skills.config]]
name = "golang-gopls"
enabled = true

[mcp_servers.mermaid]
url = "https://mcp.mermaid.ai/mcp"

[mcp_servers.graphify]
command = "/workspace/tooling/bin/graphify-mcp"
args = ["graphify-out/graph.json"]

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"

[mcp_servers.repomix_skills]
command = "npx"
args = ["-y", "repomix@1.18.1", "--mcp"]
env = { npm_config_cache = "/workspace/tooling/cache/npm" }
default_tools_approval_mode = "prompt"
startup_timeout_sec = 45

[mcp_servers.repomix]
command = "npx"
args = ["-y", "repomix@1.18.1", "--mcp", "--sandbox", "."]
env = { npm_config_cache = "/workspace/tooling/cache/npm" }
startup_timeout_sec = 45

[mcp_servers.gopls]
command = "/workspace/tooling/mise-data/installs/go-golang-org-x-tools-gopls/0.24.0/bin/gopls"
args = ["mcp"]
env = { PATH = "/workspace/tooling/mise-data/installs/go/1.27.4/bin:/usr/local/bin:/usr/bin:/bin", GOCACHE = "/workspace/tooling/cache/go-build", GOMODCACHE = "/workspace/tooling/go/pkg/mod" }
env_vars = ["GOPROXY", "GOPRIVATE", "GONOPROXY", "GONOSUMDB", "GOSUMDB"]

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_MCP_TOKEN"

[mcp_servers.google-developer-knowledge]
url = "https://developerknowledge.googleapis.com/mcp"
env_http_headers = { "X-Goog-Api-Key" = "DEVELOPERKNOWLEDGE_API_KEY" }

[mcp_servers.gcloud]
command = "npx"
args = ["-y", "@google-cloud/gcloud-mcp@0.5.3"]
env = { npm_config_cache = "/workspace/tooling/cache/npm", PATH = "/workspace/tooling/mise-data/installs/gcloud/592.0.0/bin:/workspace/tooling/mise-data/installs/node/24.22.1/bin:/usr/local/bin:/usr/bin:/bin" }
env_vars = ["CLOUDSDK_CONFIG", "GOOGLE_APPLICATION_CREDENTIALS", "CLOUDSDK_CORE_PROJECT", "CLOUDSDK_CORE_ACCOUNT"]
default_tools_approval_mode = "prompt"
startup_timeout_sec = 60

[mcp_servers.cloud-run]
command = "npx"
args = ["-y", "@google-cloud/cloud-run-mcp@1.12.0"]
env = { npm_config_cache = "/workspace/tooling/cache/npm" }
env_vars = ["CLOUDSDK_CONFIG", "GOOGLE_APPLICATION_CREDENTIALS", "GOOGLE_CLOUD_PROJECT", "GOOGLE_CLOUD_REGION", "DEFAULT_SERVICE_NAME", "SKIP_IAM_CHECK", "RUN_INGRESS_POLICY"]
default_tools_approval_mode = "prompt"
startup_timeout_sec = 60

[mcp_servers.gke]
command = "gke-mcp"
env_vars = ["DK_API_KEY", "CLOUDSDK_CONFIG", "GOOGLE_APPLICATION_CREDENTIALS", "CLOUDSDK_CORE_PROJECT", "CLOUDSDK_CORE_ACCOUNT", "CLOUDSDK_COMPUTE_REGION", "CLOUDSDK_COMPUTE_ZONE", "KUBECONFIG", "GKE_MCP_PROVIDER", "GKE_MCP_MODEL", "GOOGLE_CLOUD_PROJECT", "GOOGLE_CLOUD_LOCATION"]
default_tools_approval_mode = "prompt"

[mcp_servers.toolbox]
command = "npx"
args = ["-y", "@toolbox-sdk/server@1.17.0", "--prebuilt", "firestore", "--stdio"]
env = { npm_config_cache = "/workspace/tooling/cache/npm" }
env_vars = ["FIRESTORE_PROJECT", "FIRESTORE_DATABASE", "CLOUDSDK_CONFIG", "GOOGLE_APPLICATION_CREDENTIALS"]
default_tools_approval_mode = "prompt"
startup_timeout_sec = 120

[mcp_servers.shadcn]
command = "npx"
args = ["-y", "shadcn@4.23.0", "mcp"]
cwd = "frontend/miniapp"
env = { npm_config_cache = "/workspace/tooling/cache/npm" }
startup_timeout_sec = 45

[mcp_servers.next-devtools]
command = "npx"
args = ["-y", "next-devtools-mcp@0.4.0"]
cwd = "frontend/miniapp"
env = { npm_config_cache = "/workspace/tooling/cache/npm" }
env_vars = ["NEXT_TELEMETRY_DISABLED"]
default_tools_approval_mode = "writes"
startup_timeout_sec = 30
