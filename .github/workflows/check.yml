name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.22.1"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.4"
          cache-dependency-path: backend/go.sum
      - run: npm install --global pnpm@12.18.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm api:check
      - run: python3 scripts/check/check_config.py
      - run: pnpm --filter @repo/miniapp check
      - run: pnpm --filter @repo/miniapp test
      - run: pnpm --filter @repo/miniapp build
      - name: Install browser integration tools
        run: |
          python3 -m venv "$RUNNER_TEMP/browser"
          "$RUNNER_TEMP/browser/bin/pip" install playwright==1.62.0
          "$RUNNER_TEMP/browser/bin/playwright" install --with-deps chromium
          echo "$RUNNER_TEMP/browser/bin" >> "$GITHUB_PATH"
      - name: Run Go, Firestore and browser integration tests
        env:
          MINIAPP_BROWSER_EXPORT: ${{ github.workspace }}/frontend/miniapp/out
        run: |
          set -euo pipefail
          go -C backend list ./... > "$RUNNER_TEMP/packages"
          bash scripts/test/firestore_emulator.sh -json ./... | tee "$RUNNER_TEMP/go-results"
          python3 scripts/check/check_go_test_results.py "$RUNNER_TEMP/go-results" "$RUNNER_TEMP/packages"
      - run: go -C backend vet ./...
      - run: go -C backend build ./...
      - run: pnpm docs:check
