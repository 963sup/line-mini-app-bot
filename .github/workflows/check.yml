name: Repository checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  configuration:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check-config.py
      - name: Shell syntax
        run: bash -n scripts/*.sh
      - name: Whitespace
        run: git diff --check
  go:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Inspect module
        id: module
        run: |
          python3 - <<'PY'
          import os, pathlib, tomllib
          config = tomllib.loads(pathlib.Path("mise.toml").read_text())
          exists = pathlib.Path("go.mod").is_file()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("present=" + str(exists).lower(), file=output)
              print("version=" + config["tools"]["go"], file=output)
          if not exists:
              print("Application checks NOT RUN: no go.mod exists yet.")
          PY
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: steps.module.outputs.present == 'true'
        with:
          go-version: ${{ steps.module.outputs.version }}
          cache: ${{ hashFiles('go.sum') != '' }}
      - name: Verify Go application
        if: steps.module.outputs.present == 'true'
        env:
          GOTOOLCHAIN: local
          GOFLAGS: -mod=readonly
        run: |
          go mod download
          go mod verify
          go vet ./...
          go test -race ./...
          go build ./...
