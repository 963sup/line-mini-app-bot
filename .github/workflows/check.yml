name: Repository checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.22.1"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.4"
          cache-dependency-path: backend/go.sum
      - run: npm install --global pnpm@12.18.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @repo/miniapp check
      - run: pnpm --filter @repo/miniapp test
      - run: pnpm --filter @repo/miniapp build
      - name: Run Go tests including architecture boundaries and regressions
        run: go -C backend test ./...
      - run: go -C backend vet ./...
      - run: go -C backend build ./...
