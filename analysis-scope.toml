schema = 1
# Universe: git ls-files, plus these explicit files before their first commit.
additional = [
  "cmd/attendancemigrate/main.go",
  "cmd/server/attendance_query.go",
  "cmd/server/web/app-api.js",
  "cmd/server/web/correction.html",
  "cmd/server/web/correction.js",
  "cmd/server/web/history.html",
  "cmd/server/web/history.js",
  "cmd/server/web/home.html",
  "cmd/server/web/review.html",
  "cmd/server/web/review.js",
  "docs/features/attendance-queries.md",
  "firestore.indexes.json",
  "internal/adapters/firestore/attendance_migration.go",
  "internal/adapters/firestore/attendance_query.go",
  "internal/attendance/query.go",
]
managed_suffixes = [".go", ".mod", ".sum", ".sh", ".py", ".toml", ".md", ".json", ".yaml", ".yml", ".js", ".cjs", ".css", ".html", ".txt"]
managed_names = ["Dockerfile", "LICENSE", "GOOGLE-SKILLS-LICENSE", ".editorconfig", ".gcloudignore", ".gitattributes", ".gitignore", ".dockerignore", ".graphifyignore", ".repomixignore", ".env.example"]

[[exclude]]
pattern = ".agents/*"
reason = "Agent installation metadata and upstream skill provenance are outside application analysis"
impact = "Agent metadata is not project dependency evidence; maintained project documentation remains included"
owner = "tooling"

[[exclude]]
pattern = "skills-lock.json"
reason = "Generated upstream skill installation lockfile"
impact = "Skill installation metadata is not application dependency evidence"
owner = "tooling"

[[exclude]]
pattern = ".agents/skills/*"
reason = "Upstream skills have their own provenance and maintenance lifecycle"
impact = "Third-party skill internals are not project dependency evidence"
owner = "tooling"

[[exclude]]
pattern = ".codex/skills/*"
reason = "Generated installation copies of upstream skills"
impact = "Installation copies are not analyzed"
owner = "tooling"

[[exclude]]
pattern = "graphify-out/*"
reason = "Generated analysis artifacts; avoid recursive analysis"
impact = "Graph structure and coverage are verified separately during audit"
owner = "tooling"

[[exclude]]
pattern = "repomix-output.*"
reason = "Generated source bundle"
impact = "Bundle coverage is verified separately during audit"
owner = "tooling"

[[exclude]]
pattern = "assets/richmenu/*.jpg"
reason = "Binary LINE rich menu images cannot be represented in text source bundles"
impact = "Menu definitions and upload code remain managed; image appearance requires visual verification"
owner = "application"
