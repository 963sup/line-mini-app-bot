schema = 1
# Universe: tracked files, explicit additions and non-ignored documentation sources below.
# Remove an addition once its path is tracked; working-tree deletions are omitted.
additional = []
working_tree_docs = ["docs/**/*.md", "docs/**/*.mermaid", "docs/**/*.svg"]
managed_agent_guides = [".agents/AGENTS.md", ".agents/README.md", ".agents/go-workflow.md"]
managed_suffixes = [".rules", ".go", ".mod", ".sum", ".sh", ".py", ".toml", ".md", ".json", ".yaml", ".yml", ".js", ".cjs", ".mjs", ".mts", ".ts", ".tsx", ".css", ".html", ".txt", ".mermaid", ".svg"]
managed_names = ["mise.lock", "Dockerfile", "LICENSE", "GOOGLE-SKILLS-LICENSE", ".editorconfig", ".gcloudignore", ".gitattributes", ".gitignore", ".dockerignore", ".graphifyignore", ".repomixignore", ".env.example"]

[[exclude]]
pattern = "docs/development/tooling/shadcn-reference/snapshot/*"
reason = "Generated upstream documentation snapshot has its own source manifest and integrity checks"
impact = "Reference pages are searched on demand; project guidance and download script remain managed"
owner = "tooling"

[[exclude]]
pattern = ".agents/*"
reason = "Agent installation metadata and upstream skill provenance are outside application analysis"
impact = "Agent metadata is not project dependency evidence; maintained project documentation remains included"
owner = "tooling"

[[exclude]]
pattern = "skills-lock.json"
reason = "Generated upstream skill installation lockfile"
impact = "Skill installation metadata is not application dependency evidence"
owner = "tooling"

[[exclude]]
pattern = ".agents/skills/*"
reason = "Upstream skills have their own provenance and maintenance lifecycle"
impact = "Third-party skill internals are not project dependency evidence"
owner = "tooling"

[[exclude]]
pattern = "graphify-out/*"
reason = "Generated analysis artifacts; avoid recursive analysis"
impact = "Graph structure and coverage are verified separately during audit"
owner = "tooling"

[[exclude]]
pattern = "repomix-output.*"
reason = "Generated source bundle"
impact = "Bundle coverage is verified separately during audit"
owner = "tooling"

[[exclude]]
pattern = "assets/line/richmenu/*.[jJ][pP][gG]"
reason = "Binary LINE rich menu images cannot be represented in text source bundles"
impact = "Menu definitions and upload code remain managed; image appearance requires visual verification"
owner = "application"
