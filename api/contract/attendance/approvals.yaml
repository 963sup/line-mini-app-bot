    "/api/v1/attendance/corrections/{id}/reject": {
      "post": {
        "operationId": "rejectAttendanceCorrection",
        "summary": "Reject with a reason, authorized independent reviewer only",
        "tags": [
          "attendance"
        ],
        "security": [
          {
            "bearerAuth": []
          },
          {
            "sessionCookie": []
          }
        ],
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[A-Za-z0-9_-]{1,128}$"
            }
          },
          {
            "in": "header",
            "name": "X-CSRF-Token",
            "description": "Required when authenticating with the session cookie.",
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CorrectionDecisionResult"
                }
              }
            }
          },
          "400": {
            "$ref": "./corrections.yaml#/components/responses/CorrectionError"
          },
          "401": {
            "$ref": "./corrections.yaml#/components/responses/CorrectionError"
          },
          "403": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "./../openapi.yaml#/components/schemas/APIError"
                }
              },
              "text/plain": {
                "schema": {
                  "type": "string"
                },
                "example": "cross-origin request blocked"
              }
            }
          },
          "404": {
            "$ref": "./corrections.yaml#/components/responses/CorrectionError"
          },
          "409": {
            "$ref": "./corrections.yaml#/components/responses/CorrectionError"
          },
          "415": {
            "$ref": "./corrections.yaml#/components/responses/CorrectionError"
          },
          "503": {
            "$ref": "./corrections.yaml#/components/responses/CorrectionError"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CorrectionDecision"
              }
            }
          }
        }
      }
    },
    "/api/v1/attendance/corrections/reviewer-groups": {
      "get": {
        "operationId": "listAttendanceReviewerGroups",
        "summary": "List server-provisioned reviewer groups",
        "tags": [
          "attendance"
        ],
        "security": [
          {
            "bearerAuth": []
          },
          {
            "sessionCookie": []
          }
        ],
        "parameters": [],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "$ref": "./records.yaml#/components/schemas/GroupItem"
                  }
                }
              }
            }
          },
          "400": {
            "$ref": "./corrections.yaml#/components/responses/CorrectionError"
          },
          "401": {
            "$ref": "./corrections.yaml#/components/responses/CorrectionError"
          },
          "403": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "./../openapi.yaml#/components/schemas/APIError"
                }
              }
            }
          },
          "404": {
            "$ref": "./corrections.yaml#/components/responses/CorrectionError"
          },
          "409": {
            "$ref": "./corrections.yaml#/components/responses/CorrectionError"
          },
          "415": {
            "$ref": "./corrections.yaml#/components/responses/CorrectionError"
          },
          "503": {
            "$ref": "./corrections.yaml#/components/responses/CorrectionError"
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "CorrectionReview": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "groupId": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          },
          "recordId": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_-]{1,128}$"
          },
          "expectedEventSequence": {
            "type": "integer",
            "format": "int64"
          },
          "expectedRevision": {
            "type": "integer",
            "format": "int64"
          },
          "reason": {
            "type": "string"
          },
          "start": {
            "type": "string",
            "format": "date-time"
          },
          "end": {
            "type": "string",
            "format": "date-time"
          },
          "breaks": {
            "type": "array",
            "items": {
              "$ref": "./worktime.yaml#/components/schemas/Interval"
            },
            "nullable": true,
            "maxItems": 100
          },
          "restConfirmed": {
            "type": "boolean"
          },
          "status": {
            "type": "string",
            "description": "pending, approved, rejected, cancelled, stale or invalid"
          },
          "decisionReason": {
            "type": "string"
          },
          "reviewedAt": {
            "type": "string",
            "format": "date-time"
          },
          "newRecord": {
            "type": "boolean"
          },
          "before": {
            "$ref": "./records.yaml#/components/schemas/AttendanceRecord"
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          },
          "applicantName": {
            "type": "string",
            "description": "Verified session display name captured at submission; older requests may omit it."
          }
        },
        "required": [
          "id",
          "groupId",
          "recordId",
          "expectedEventSequence",
          "expectedRevision",
          "reason",
          "start",
          "end",
          "breaks",
          "restConfirmed"
        ]
      },
      "CorrectionApproved": {
        "type": "object",
        "properties": {
          "status": {
            "type": "string",
            "enum": [
              "approved"
            ]
          }
        },
        "required": [
          "status"
        ]
      },
      "CorrectionDecision": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "reason"
        ],
        "properties": {
          "reason": {
            "type": "string",
            "minLength": 1,
            "maxLength": 500
          }
        }
      },
      "CorrectionDecisionResult": {
        "type": "object",
        "required": [
          "status"
        ],
        "properties": {
          "status": {
            "type": "string"
          }
        }
      }
    }
  }
}
