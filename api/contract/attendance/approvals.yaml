    "/api/v1/attendance/corrections/{id}/reject": {
      "post": {
        "operationId": "rejectAttendanceCorrection",
        "summary": "Reject with a reason, authorized independent reviewer only",
        "tags": [
          "attendance"
        ],
        "security": [
          {
            "bearerAuth": []
          },
          {
            "sessionCookie": []
          }
        ],
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[A-Za-z0-9_-]{1,128}$"
            }
          },
          {
            "in": "header",
            "name": "X-CSRF-Token",
            "description": "Required when authenticating with the session cookie.",
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "./corrections.yaml#/components/schemas/CorrectionDecisionResult"
                }
              }
            }
          },
          "400": {
            "$ref": "./corrections.yaml#/components/responses/CorrectionError"
          },
          "401": {
            "$ref": "./corrections.yaml#/components/responses/CorrectionError"
          },
          "403": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "./../common/transport.yaml#/components/schemas/APIError"
                }
              },
              "text/plain": {
                "schema": {
