          },
          "409": {
            "$ref": "./corrections.yaml#/components/responses/CorrectionError"
          },
          "415": {
            "$ref": "./corrections.yaml#/components/responses/CorrectionError"
          },
          "503": {
            "$ref": "./corrections.yaml#/components/responses/CorrectionError"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CorrectionDecision"
              }
            }
          }
        }
      }
