          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "CorrectionApproved": {
        "type": "object",
        "properties": {
          "status": {
            "type": "string",
            "enum": [
              "approved"
            ]
          }
        },
        "required": [
          "status"
        ]
      },
      "CorrectionDecision": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "reason"
        ],
        "properties": {
          "reason": {
            "type": "string",
            "minLength": 1,
            "maxLength": 500
          }
        }
      }
    }
  }
}
