{
  "paths": {
    "/api/v1/attendance/corrections": {
      "post": {
        "operationId": "proposeAttendanceCorrection",
        "summary": "proposeAttendanceCorrection",
        "tags": [
          "attendance"
        ],
        "security": [
          {
            "bearerAuth": []
          },
          {
            "sessionCookie": []
          }
        ],
        "parameters": [
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": false,
            "schema": {
              "type": "string",
              "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
            },
            "description": "Optional for existing clients. Same user/key/payload replays the original acceptance; different payload returns 409. Preserve this key across ambiguous failures."
          },
          {
            "in": "header",
            "name": "X-CSRF-Token",
            "description": "Required when authenticating with the session cookie.",
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "202": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CorrectionAccepted"
                }
              }
            }
          },
          "400": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "./../openapi.yaml#/components/schemas/APIError"
                }
              }
            }
          },
          "401": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "./../openapi.yaml#/components/schemas/APIError"
                }
              }
            }
          },
          "403": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "./../openapi.yaml#/components/schemas/APIError"
                }
              },
              "text/plain": {
                "schema": {
                  "type": "string"
                },
                "example": "cross-origin request blocked"
              }
            }
          },
          "404": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "./../openapi.yaml#/components/schemas/APIError"
                }
              }
            }
          },
          "409": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "./../openapi.yaml#/components/schemas/APIError"
                }
              }
            }
          },
          "415": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "./../openapi.yaml#/components/schemas/APIError"
                }
              }
            }
          },
          "503": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "./../openapi.yaml#/components/schemas/APIError"
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CorrectionSubmission"
              }
            }
          }
        }
      },
      "get": {
        "operationId": "listAttendanceCorrections",
        "summary": "List own requests, or group requests for an authorized reviewer",
        "tags": [
          "attendance"
        ],
        "security": [
          {
            "bearerAuth": []
          },
          {
            "sessionCookie": []
          }
        ],
        "parameters": [
          {
            "in": "query",
            "name": "scope",
            "schema": {
              "type": "string",
              "enum": [
                "own",
                "review"
              ],
              "default": "own"
            }
          },
          {
            "in": "query",
            "name": "group",
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 128
            }
          },
          {
            "in": "query",
            "name": "cursor",
            "schema": {
              "type": "string",
              "maxLength": 1024
            }
          },
          {
            "in": "query",
            "name": "pageSize",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 20
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CorrectionPage"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/CorrectionError"
          },
          "401": {
            "$ref": "#/components/responses/CorrectionError"
          },
          "403": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "./../openapi.yaml#/components/schemas/APIError"
                }
              }
            }
          },
          "404": {
            "$ref": "#/components/responses/CorrectionError"
          },
          "409": {
            "$ref": "#/components/responses/CorrectionError"
          },
          "415": {
            "$ref": "#/components/responses/CorrectionError"
          },
          "503": {
            "$ref": "#/components/responses/CorrectionError"
          }
        }
      }
    },
    "/api/v1/attendance/corrections/{id}": {
      "get": {
        "operationId": "getAttendanceCorrectionStatus",
        "summary": "getAttendanceCorrectionStatus",
        "tags": [
          "attendance"
        ],
        "security": [
          {
            "bearerAuth": []
          },
          {
            "sessionCookie": []
          }
        ],
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[A-Za-z0-9_-]{1,128}$"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CorrectionStatus"
                }
              }
            }
          },
          "400": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "./../openapi.yaml#/components/schemas/APIError"
                }
              }
            }
          },
          "401": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "./../openapi.yaml#/components/schemas/APIError"
                }
              }
            }
          },
          "403": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "./../openapi.yaml#/components/schemas/APIError"
                }
              }
            }
          },
          "404": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "./../openapi.yaml#/components/schemas/APIError"
                }
              }
            }
          },
          "409": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "./../openapi.yaml#/components/schemas/APIError"
                }
              }
            }
          },
          "415": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "./../openapi.yaml#/components/schemas/APIError"
                }
              }
            }
          },
          "503": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "./../openapi.yaml#/components/schemas/APIError"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/attendance/corrections/{id}/cancel": {
      "post": {
        "operationId": "cancelAttendanceCorrection",
        "summary": "Withdraw own pending request",
        "tags": [
          "attendance"
        ],
        "security": [
          {
            "bearerAuth": []
          },
          {
            "sessionCookie": []
          }
        ],
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[A-Za-z0-9_-]{1,128}$"
            }
          },
          {
            "in": "header",
            "name": "X-CSRF-Token",
            "description": "Required when authenticating with the session cookie.",
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "./approvals.yaml#/components/schemas/CorrectionDecisionResult"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/CorrectionError"
          },
          "401": {
            "$ref": "#/components/responses/CorrectionError"
          },
          "403": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "./../openapi.yaml#/components/schemas/APIError"
                }
              },
              "text/plain": {
                "schema": {
                  "type": "string"
                },
                "example": "cross-origin request blocked"
              }
            }
          },
          "404": {
            "$ref": "#/components/responses/CorrectionError"
          },
          "409": {
            "$ref": "#/components/responses/CorrectionError"
          },
          "415": {
            "$ref": "#/components/responses/CorrectionError"
          },
          "503": {
            "$ref": "#/components/responses/CorrectionError"
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "CorrectionSubmission": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "groupId": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          },
          "recordId": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_-]{1,128}$"
          },
          "expectedEventSequence": {
            "type": "integer",
            "format": "int64"
          },
          "expectedRevision": {
            "type": "integer",
            "format": "int64"
          },
          "reason": {
            "type": "string"
          },
          "start": {
            "type": "string",
            "format": "date-time"
          },
          "end": {
            "type": "string",
            "format": "date-time"
          },
          "breaks": {
            "type": "array",
            "items": {
              "$ref": "./worktime.yaml#/components/schemas/Interval"
            },
            "nullable": true,
            "maxItems": 100
          },
          "restConfirmed": {
            "type": "boolean"
          }
        },
        "required": [
          "groupId"
        ],
        "additionalProperties": false,
        "description": "Omit recordId to request a missing completed shift; otherwise correct an existing shift. All requests require independent human approval. Server allocates IDs. Revision and event sequence apply to existing records."
      },
      "CorrectionAccepted": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "status": {
            "type": "string",
            "enum": [
              "accepted"
            ]
          }
        },
        "required": [
          "id",
          "status"
        ]
      },
      "CorrectionStatus": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "status": {
            "type": "string",
            "description": "pending, approved, rejected, cancelled, stale or invalid"
          },
          "decisionReason": {
            "type": "string"
          },
          "reviewedAt": {
            "type": "string",
            "format": "date-time"
          }
        },
        "required": [
          "id",
          "status"
        ]
      },
      "CorrectionPage": {
        "type": "object",
        "required": [
          "items",
          "nextCursor"
        ],
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "$ref": "./approvals.yaml#/components/schemas/CorrectionReview"
            }
          },
          "nextCursor": {
            "type": "string"
          }
        }
      }
    },
    "responses": {
      "CorrectionError": {
        "description": "Request rejected or service unavailable",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "./../openapi.yaml#/components/schemas/APIError"
            }
          }
        }
      }
    }
  }
}
