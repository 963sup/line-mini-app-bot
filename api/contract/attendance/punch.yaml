  "components": {
    "schemas": {
      "LaunchRequest": {
        "type": "object",
        "properties": {
          "launch": {
            "type": "string",
            "pattern": "^[0-9a-f]{64}$"
          }
        },
        "required": [
          "launch"
        ],
        "additionalProperties": false
      },
      "LaunchResponse": {
        "type": "object",
        "properties": {
          "requestId": {
            "type": "string",
            "pattern": "^[0-9a-f]{64}$"
          }
        },
        "required": [
          "requestId"
        ]
      },
      "PunchRequest": {
        "type": "object",
        "properties": {
          "requestId": {
            "type": "string",
            "pattern": "^[0-9a-f]{64}$"
          },
          "latitude": {
            "type": "number",
            "minimum": -90,
            "maximum": 90,
            "format": "double"
          },
          "longitude": {
            "type": "number",
            "minimum": -180,
            "maximum": 180,
            "format": "double"
          },
          "accuracyMeters": {
            "type": "number",
            "minimum": 0,
            "format": "double"
          },
          "capturedAt": {
            "type": "string",
            "format": "date-time"
          }
        },
        "required": [
          "requestId",
          "latitude",
          "longitude",
          "accuracyMeters",
          "capturedAt"
        ],
        "additionalProperties": false
      },
      "PunchResponse": {
        "type": "object",
        "properties": {
          "code": {
            "type": "string"
          },
          "message": {
            "type": "string"
          }
        },
        "required": [
          "code",
          "message"
        ]
      },
      "PunchPreflightRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "requestId"
        ],
        "properties": {
          "requestId": {
            "type": "string",
            "pattern": "^[0-9a-f]{64}$"
          }
        }
      }
    }
  }
}
