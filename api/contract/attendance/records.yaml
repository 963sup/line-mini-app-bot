  "components": {
    "schemas": {
      "Position": {
        "type": "object",
        "properties": {
          "latitude": {
            "type": "number",
            "minimum": -90,
            "maximum": 90,
            "format": "double"
          },
          "longitude": {
            "type": "number",
            "minimum": -180,
            "maximum": 180,
            "format": "double"
          },
          "accuracyMeters": {
            "type": "number",
            "minimum": 0,
            "format": "double"
          },
          "capturedAt": {
            "type": "string",
            "format": "date-time"
          }
        },
        "required": [
          "latitude",
          "longitude",
          "accuracyMeters",
          "capturedAt"
        ]
      },
      "AttendanceRecord": {
        "type": "object",
        "properties": {
          "RecordID": {
            "type": "string"
          },
          "GroupID": {
            "type": "string"
          },
          "ClockInAt": {
            "type": "string",
            "format": "date-time"
          },
          "ClockOutAt": {
            "type": "string",
            "format": "date-time"
          },
          "Revision": {
            "type": "integer",
            "format": "int64"
          },
          "EventSequence": {
            "type": "integer",
            "format": "int64"
          },
          "Breaks": {
            "type": "array",
            "items": {
              "$ref": "./worktime.yaml#/components/schemas/Interval"
            },
            "nullable": true
          },
          "BreakStartedAt": {
            "type": "string",
            "format": "date-time"
          },
          "RestConfirmed": {
            "type": "boolean"
          },
          "RebuildIssues": {
            "type": "array",
            "items": {
              "type": "string"
            },
            "nullable": true
          },
          "AttendanceMinutes": {
            "type": "integer",
            "format": "int64",
            "description": "Gross full-shift attendance, not clipped to the requested month."
          },
          "EstimatedMinutes": {
            "type": "integer",
            "format": "int64",
            "description": "Full-shift work estimate; confirmed shifts deduct confirmed rests."
          },
          "WorktimeStatus": {
            "type": "string",
            "description": "confirmed, estimated (rest unconfirmed), or invalid (cannot calculate)."
          }
        },
        "required": [
          "RecordID",
          "GroupID",
          "ClockInAt",
          "ClockOutAt",
          "Revision",
          "EventSequence",
          "Breaks",
          "BreakStartedAt",
          "RestConfirmed",
          "RebuildIssues"
        ]
      },
      "StoredRecord": {
        "type": "object",
        "properties": {
          "RecordID": {
            "type": "string"
          },
