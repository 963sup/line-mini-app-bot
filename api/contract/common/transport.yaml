{
  "components": {
    "schemas": {
      "APIError": {
        "type": "object",
        "required": [
          "error"
        ],
        "properties": {
          "error": {
            "type": "object",
            "required": [
              "code",
              "message"
            ],
            "properties": {
              "code": {
                "type": "string"
              },
              "retrySameRequest": {
                "description": "Recovery guidance for this attempt: true means retain the original request and idempotency key; false permits editing after a first failed attempt. A later response cannot resolve an earlier unknown outcome. Missing on older servers or errors without recovery guidance.",
                "type": "boolean"
              },
              "conflictReason": {
                "description": "Optional reason for a Wiki conflict. The top-level error code remains conflict.",
                "type": "string",
                "enum": [
                  "stale_version",
                  "duplicate_title",
                  "creation_key",
                  "version_limit"
                ]
              },
              "message": {
                "type": "string"
              }
            }
          }
        }
      },
      "AuditHistoryStatus": {
        "type": "string",
        "description": "Availability of the audit history reader for this visible scope. Unavailable does not mean there have been no changes.",
        "enum": [
          "unavailable"
        ],
        "x-enum-varnames": [
          "AuditHistoryStatusUnavailable"
        ]
      }
    },
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer"
      },
      "sessionCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "__Host-session",
        "description": "Server session with sliding expiry capped by the verified LINE token and absolute lifetime. Unsafe requests require same-origin Origin and X-CSRF-Token."
      }
    }
  }
}
