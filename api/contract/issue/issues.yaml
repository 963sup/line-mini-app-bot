{
  "paths": {
    "/api/v1/repositories/{repositoryId}/issues": {
      "get": {
        "operationId": "listIssues",
        "summary": "List issues for a current repository member in descending shared-number order",
        "security": [
          {
            "bearerAuth": []
          },
          {
            "sessionCookie": []
          }
        ],
        "parameters": [
          {
            "in": "path",
            "name": "repositoryId",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            }
          },
          {
            "in": "query",
            "name": "cursor",
            "schema": {
              "type": "string",
              "maxLength": 1024
            }
          },
          {
            "in": "query",
            "name": "state",
            "schema": {
              "type": "string",
              "enum": [
                "open",
                "in_progress",
                "completed"
              ]
            }
          },
          {
            "in": "query",
            "name": "query",
            "schema": {
              "type": "string",
              "maxLength": 120
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Authorized result; no-store",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/IssuePage"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/IssueError"
          },
          "401": {
            "$ref": "#/components/responses/IssueError"
          },
          "403": {
            "$ref": "#/components/responses/IssueForbidden"
          },
          "404": {
            "$ref": "#/components/responses/IssueError"
          },
          "409": {
            "$ref": "#/components/responses/IssueError"
          },
          "415": {
            "$ref": "#/components/responses/IssueError"
          },
          "503": {
            "$ref": "#/components/responses/IssueError"
          }
        }
      },
      "post": {
        "operationId": "createIssue",
        "summary": "Create an open issue as a current member; shared repository number and idempotent creation",
        "security": [
          {
            "bearerAuth": []
          },
          {
            "sessionCookie": []
          }
        ],
        "parameters": [
          {
            "in": "path",
            "name": "repositoryId",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            }
          },
          {
            "in": "header",
            "name": "Idempotency-Key",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[A-Za-z0-9_-]{16,128}$"
            },
            "description": "Reuse the same key and normalized content after an ambiguous result. Scoped to the verified actor and repository across resource types."
          },
          {
            "in": "header",
            "name": "X-CSRF-Token",
            "schema": {
              "type": "string"
            },
            "description": "Required for Cookie Session writes; validated by the existing session authenticator."
          }
        ],
        "responses": {
          "200": {
            "description": "Authorized result; no-store",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Issue"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/IssueError"
          },
          "401": {
            "$ref": "#/components/responses/IssueError"
          },
          "403": {
            "$ref": "#/components/responses/IssueForbidden"
          },
          "404": {
            "$ref": "#/components/responses/IssueError"
          },
          "409": {
            "$ref": "#/components/responses/IssueError"
          },
          "415": {
            "$ref": "#/components/responses/IssueError"
          },
          "503": {
            "$ref": "#/components/responses/IssueError"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/IssueCreation"
              }
            }
          }
        }
      }
    },
    "/api/v1/repositories/{repositoryId}/issues/{id}": {
      "get": {
        "operationId": "getIssue",
        "summary": "Read an issue as a current repository member",
        "security": [
          {
            "bearerAuth": []
          },
          {
            "sessionCookie": []
          }
        ],
        "parameters": [
          {
            "in": "path",
            "name": "repositoryId",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            }
          },
          {
            "in": "path",
            "name": "id",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Authorized result; no-store",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Issue"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/IssueError"
          },
          "401": {
            "$ref": "#/components/responses/IssueError"
          },
          "403": {
            "$ref": "#/components/responses/IssueForbidden"
          },
          "404": {
            "$ref": "#/components/responses/IssueError"
          },
          "409": {
            "$ref": "#/components/responses/IssueError"
          },
          "415": {
            "$ref": "#/components/responses/IssueError"
          },
          "503": {
            "$ref": "#/components/responses/IssueError"
          }
        }
      },
      "patch": {
        "operationId": "updateIssue",
        "summary": "Creator-only content and state update; expected version required; open to in_progress to completed to open",
        "security": [
          {
            "bearerAuth": []
          },
          {
            "sessionCookie": []
          }
        ],
        "parameters": [
          {
            "in": "path",
            "name": "repositoryId",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            }
          },
          {
            "in": "path",
            "name": "id",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            }
          },
          {
            "in": "header",
            "name": "X-CSRF-Token",
            "schema": {
              "type": "string"
            },
            "description": "Required for Cookie Session writes; validated by the existing session authenticator."
          }
        ],
        "responses": {
          "200": {
            "description": "Authorized result; no-store",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Issue"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/IssueError"
          },
          "401": {
            "$ref": "#/components/responses/IssueError"
          },
          "403": {
            "$ref": "#/components/responses/IssueForbidden"
          },
          "404": {
            "$ref": "#/components/responses/IssueError"
          },
          "409": {
            "$ref": "#/components/responses/IssueError"
          },
          "415": {
            "$ref": "#/components/responses/IssueError"
          },
          "503": {
            "$ref": "#/components/responses/IssueError"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/IssueUpdate"
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "Issue": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "repositoryId",
          "number",
          "title",
          "body",
          "state",
          "creatorId",
          "version",
          "createdAt",
          "updatedAt"
        ],
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^[a-f0-9]{32}$"
          },
          "repositoryId": {
            "type": "string",
            "pattern": "^[a-f0-9]{32}$"
          },
          "number": {
            "type": "integer",
            "format": "int64",
            "minimum": 1,
            "maximum": 9007199254740991
          },
          "title": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "body": {
            "type": "string",
            "maxLength": 8000
          },
          "state": {
            "type": "string",
            "enum": [
              "open",
              "in_progress",
              "completed"
            ]
          },
          "creatorId": {
            "type": "string",
            "minLength": 1
          },
          "version": {
            "type": "integer",
            "format": "int64",
            "minimum": 1,
            "maximum": 9007199254740991
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          },
          "updatedAt": {
            "type": "string",
            "format": "date-time"
          },
          "labelIds": {
            "type": "array",
            "maxItems": 10,
            "uniqueItems": true,
            "items": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            },
            "description": "Same-repository label IDs. Update omission preserves existing references; [] clears them. Requires the existing resource author and expectedVersion."
          },
          "milestoneId": {
            "type": "string",
            "pattern": "^[a-f0-9]{32}$",
            "nullable": true,
            "description": "Same repository milestone; omitted on update preserves, null clears"
          }
        }
      },
      "IssueCreation": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "title",
          "body"
        ],
        "properties": {
          "title": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "body": {
            "type": "string",
            "maxLength": 8000
          }
        }
      },
      "IssueUpdate": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "title",
          "body",
          "state",
          "expectedVersion"
        ],
        "properties": {
          "title": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "body": {
            "type": "string",
            "maxLength": 8000
          },
          "state": {
            "type": "string",
            "enum": [
              "open",
              "in_progress",
              "completed"
            ]
          },
          "expectedVersion": {
            "type": "integer",
            "format": "int64",
            "minimum": 1,
            "maximum": 9007199254740991
          },
          "labelIds": {
            "type": "array",
            "maxItems": 10,
            "uniqueItems": true,
            "items": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            },
            "description": "Same-repository label IDs. Update omission preserves existing references; [] clears them. Requires the existing resource author and expectedVersion."
          },
          "milestoneId": {
            "type": "string",
            "pattern": "^[a-f0-9]{32}$",
            "nullable": true,
            "description": "Same repository milestone; omitted on update preserves, null clears"
          }
        }
      },
      "IssuePage": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "items",
          "nextCursor"
        ],
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Issue"
            }
          },
          "nextCursor": {
            "type": "string",
            "description": "Empty when finished. Pages inspect at most twenty candidates and may be empty after filtering; continue while nextCursor is nonempty."
          }
        }
      }
    },
    "responses": {
      "IssueError": {
        "description": "Request rejected or unavailable; errors never expose hidden resources.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "../common/transport.yaml#/components/schemas/APIError"
            }
          }
        }
      },
      "IssueForbidden": {
        "description": "Creator permission or CSRF denied. Standard cross-origin protection may return text/plain.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "../common/transport.yaml#/components/schemas/APIError"
            }
          },
          "text/plain": {
            "schema": {
              "type": "string"
            }
          }
        }
      }
    }
  }
}
