  },
  "components": {
    "schemas": {
      "ObjectImportEvidence": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "page",
          "quote"
        ],
        "properties": {
          "page": {
            "type": "integer",
            "minimum": 1,
            "maximum": 1000000
          },
          "quote": {
            "type": "string",
            "minLength": 1,
            "maxLength": 500
          }
        }
      },
      "ObjectImportCandidate": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "name",
          "description",
          "type",
          "quantity",
          "unit",
          "materialCode",
          "sourceItemNo",
          "evidence"
        ],
        "properties": {
          "name": {
            "type": "string",
            "maxLength": 120,
            "minLength": 1
          },
          "description": {
            "type": "string",
            "maxLength": 8000
          },
          "type": {
            "type": "string",
            "maxLength": 80,
            "minLength": 1
          },
          "quantity": {
            "type": "string",
            "maxLength": 25,
            "pattern": "^(0|[1-9][0-9]{0,17})(\\.[0-9]{1,6})?$",
            "description": "Positive exact decimal; zero rejected. Server strips trailing fractional zeroes; no exponent or float conversion."
          },
          "unit": {
            "type": "string",
            "maxLength": 32,
            "minLength": 1
          },
          "materialCode": {
            "type": "string",
            "maxLength": 120
          },
          "sourceItemNo": {
            "type": "string",
            "minLength": 1,
            "maxLength": 80
          },
          "evidence": {
            "type": "array",
            "minItems": 1,
            "maxItems": 4,
            "items": {
              "$ref": "#/components/schemas/ObjectImportEvidence"
            }
          }
        }
      },
      "ObjectImportRow": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "name",
          "description",
          "type",
          "quantity",
          "unit",
          "materialCode",
          "sourceItemNo",
          "evidence",
          "id",
          "resultObjectId"
        ],
        "properties": {
          "name": {
            "type": "string",
            "maxLength": 120,
            "minLength": 1
          },
          "description": {
            "type": "string",
            "maxLength": 8000
          },
          "type": {
            "type": "string",
            "maxLength": 80,
            "minLength": 1
          },
          "quantity": {
            "type": "string",
            "maxLength": 25,
            "pattern": "^(0|[1-9][0-9]{0,17})(\\.[0-9]{1,6})?$",
            "description": "Positive exact decimal; zero rejected. Server strips trailing fractional zeroes; no exponent or float conversion."
          },
          "unit": {
            "type": "string",
            "maxLength": 32,
            "minLength": 1
          },
          "materialCode": {
            "type": "string",
            "maxLength": 120
          },
          "sourceItemNo": {
            "type": "string",
            "minLength": 1,
            "maxLength": 80
          },
          "evidence": {
            "type": "array",
            "minItems": 1,
            "maxItems": 4,
            "items": {
              "$ref": "#/components/schemas/ObjectImportEvidence"
            }
          },
          "id": {
            "type": "string",
            "pattern": "^[a-f0-9]{32}$"
          },
          "resultObjectId": {
            "type": "string",
            "pattern": "^([a-f0-9]{32})?$"
          }
        }
      },
      "ObjectImportReviewedRow": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "name",
          "description",
          "type",
          "quantity",
          "unit",
          "materialCode",
          "id"
        ],
        "properties": {
          "name": {
            "type": "string",
            "maxLength": 120,
            "minLength": 1
          },
          "description": {
            "type": "string",
            "maxLength": 8000
          },
          "type": {
            "type": "string",
            "maxLength": 80,
            "minLength": 1
          },
          "quantity": {
            "type": "string",
            "maxLength": 25,
            "pattern": "^(0|[1-9][0-9]{0,17})(\\.[0-9]{1,6})?$",
            "description": "Positive exact decimal; zero rejected. Server strips trailing fractional zeroes; no exponent or float conversion."
          },
          "unit": {
            "type": "string",
            "maxLength": 32,
            "minLength": 1
          },
          "materialCode": {
            "type": "string",
            "maxLength": 120
          },
          "id": {
            "type": "string",
            "pattern": "^[a-f0-9]{32}$"
          }
        }
      },
      "ObjectImportCreation": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "sourceDocument",
          "sourceRevision",
          "pages",
          "rows"
        ],
        "properties": {
          "sourceDocument": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200
          },
          "sourceRevision": {
            "type": "string",
            "maxLength": 80
          },
          "pages": {
            "type": "array",
            "minItems": 1,
            "maxItems": 50,
            "items": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "number",
                "text"
              ],
              "properties": {
                "number": {
                  "type": "integer",
                  "minimum": 1,
                  "maximum": 1000000
                },
                "text": {
                  "type": "string",
                  "maxLength": 32768
                }
              }
            }
          },
          "rows": {
            "type": "array",
            "minItems": 1,
            "maxItems": 100,
            "items": {
              "$ref": "#/components/schemas/ObjectImportCandidate"
            }
          }
        }
      },
      "ObjectImportReview": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "expectedVersion",
          "rows"
        ],
        "properties": {
          "expectedVersion": {
            "type": "integer",
            "format": "int64",
            "minimum": 1,
            "maximum": 9007199254740991
          },
          "rows": {
            "type": "array",
            "minItems": 1,
            "maxItems": 100,
            "items": {
              "$ref": "#/components/schemas/ObjectImportReviewedRow"
            }
          }
        }
      },
      "ObjectImportConfirmation": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "expectedVersion"
        ],
        "properties": {
          "expectedVersion": {
            "type": "integer",
            "format": "int64",
            "minimum": 1,
            "maximum": 9007199254740991
          }
        }
      },
      "ObjectImport": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "repositoryId",
          "creatorId",
          "status",
          "version",
          "confirmedFromReviewVersion",
          "sourceDocument",
          "sourceRevision",
          "sourceHash",
          "rows",
          "createdAt",
          "updatedAt"
        ],
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^[a-f0-9]{32}$"
          },
          "repositoryId": {
            "type": "string",
            "pattern": "^[a-f0-9]{32}$"
          },
          "creatorId": {
            "type": "string"
          },
          "status": {
            "type": "string",
            "enum": [
              "draft",
              "reviewed",
              "confirming",
              "completed"
            ]
          },
          "version": {
            "type": "integer",
            "format": "int64",
            "minimum": 1,
            "maximum": 9007199254740991
          },
          "confirmedFromReviewVersion": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          },
          "sourceDocument": {
            "type": "string",
            "maxLength": 200
          },
          "sourceRevision": {
            "type": "string",
            "maxLength": 80
          },
          "sourceHash": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "rows": {
            "type": "array",
            "minItems": 1,
            "maxItems": 100,
            "items": {
              "$ref": "#/components/schemas/ObjectImportRow"
            }
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          },
          "updatedAt": {
            "type": "string",
            "format": "date-time"
          },
          "reviewedAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "ObjectImportParsing": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "sourceDocument",
          "sourceRevision",
          "pages",
          "consent"
        ],
        "properties": {
          "sourceDocument": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200
          },
          "sourceRevision": {
            "type": "string",
            "maxLength": 80
          },
          "pages": {
            "type": "array",
            "minItems": 1,
            "maxItems": 50,
            "items": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "number",
                "text"
              ],
              "properties": {
                "number": {
                  "type": "integer",
                  "minimum": 1,
                  "maximum": 1000000
                },
                "text": {
                  "type": "string",
                  "maxLength": 32768
                }
              }
            }
          },
          "consent": {
            "type": "boolean",
            "enum": [
              true
            ],
            "description": "Explicit consent to send only these previewed/redacted selected page texts to OpenAI."
          }
        }
      },
      "ObjectImportParsed": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "rows",
          "sourceHash"
        ],
        "properties": {
          "rows": {
            "type": "array",
            "minItems": 1,
            "maxItems": 100,
            "items": {
              "$ref": "#/components/schemas/ObjectImportCandidate"
            }
          },
          "sourceHash": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          }
        }
      },
      "ObjectImportRunCreation": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "sourceDocument",
          "sourceRevision"
        ],
        "properties": {
          "sourceDocument": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200
          },
          "sourceRevision": {
            "type": "string",
            "maxLength": 80
          },
          "pages": {
            "type": "array",
            "minItems": 1,
            "maxItems": 50,
            "items": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "number",
                "text"
              ],
              "properties": {
                "number": {
                  "type": "integer",
                  "minimum": 1,
                  "maximum": 1000000
                },
                "text": {
                  "type": "string",
                  "maxLength": 32768
                }
              }
            }
          },
          "type": {
            "type": "string",
            "enum": [
              "work",
              "non_work"
            ],
            "description": "User-selected batch type: work (施作) or non_work (非施作). Required for new intents; omit only to resume an existing frozen legacy run. The model cannot select this field."
          },
          "classification": {
            "type": "string",
            "enum": [
              "per_item"
            ],
            "description": "Classify each source item. Omit legacy batch type."
          },
          "decisions": {
            "type": "object",
            "additionalProperties": {
              "type": "string"
            },
            "description": "Confirm previously frozen ambiguous row IDs as work or non_work."
          },
          "workbook": {
            "type": "string",
            "maxLength": 409600,
            "description": "Base64 XLSX, up to 300 KiB. Uses per_item classification with manual type confirmation. Supply either workbook or pages."
          },
          "textFile": {
            "type": "string",
            "maxLength": 409600,
            "description": "Base64 UTF-8 CSV, TSV, tab-delimited TXT or Markdown table; format is the sourceDocument prefix."
          }
        },
        "oneOf": [
          {
            "required": [
              "pages"
            ]
          },
          {
            "required": [
              "workbook"
            ]
          },
          {
            "required": [
              "textFile"
            ]
          }
        ]
      },
      "ObjectImportRunRow": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "name",
          "description",
          "type",
          "quantity",
          "unit",
          "materialCode",
          "sourceItemNo",
          "id",
          "resultObjectId",
          "sourcePages"
        ],
        "properties": {
          "name": {
            "type": "string",
            "maxLength": 120,
            "minLength": 1
          },
          "description": {
            "type": "string",
            "maxLength": 8000
          },
          "type": {
            "type": "string",
            "maxLength": 80,
            "minLength": 1
          },
          "quantity": {
            "type": "string",
            "maxLength": 25,
            "pattern": "^(0|[1-9][0-9]{0,17})(\\.[0-9]{1,6})?$",
            "description": "Positive exact decimal; zero rejected. Server strips trailing fractional zeroes; no exponent or float conversion."
          },
          "unit": {
            "type": "string",
            "maxLength": 32,
            "minLength": 1
          },
          "materialCode": {
            "type": "string",
            "maxLength": 120
          },
          "sourceItemNo": {
            "type": "string",
            "minLength": 1,
            "maxLength": 80
          },
          "id": {
            "type": "string",
            "pattern": "^[a-f0-9]{32}$"
          },
          "resultObjectId": {
            "type": "string",
            "pattern": "^([a-f0-9]{32})?$"
          },
          "sourcePages": {
            "type": "string",
            "maxLength": 80
          }
        }
      },
      "ObjectImportRun": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "repositoryId",
          "creatorId",
          "status",
          "sourceDocument",
          "sourceRevision",
          "sourceHash",
          "rows",
          "createdAt",
          "updatedAt",
          "reason",
          "createdCount",
          "needsReviewCount",
          "canReplaceSource"
        ],
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^[a-f0-9]{32}$"
          },
          "repositoryId": {
            "type": "string",
            "pattern": "^[a-f0-9]{32}$"
          },
          "creatorId": {
            "type": "string"
          },
          "status": {
            "type": "string",
            "enum": [
              "pending",
              "processing",
              "completed"
            ],
            "description": "pending has no frozen candidate snapshot; processing has immutable candidates and unfinished writes; completed has every result."
          },
          "sourceDocument": {
            "type": "string",
            "maxLength": 200
          },
          "sourceRevision": {
            "type": "string",
            "maxLength": 80
          },
          "sourceHash": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "rows": {
            "type": "array",
            "minItems": 0,
            "maxItems": 100,
            "items": {
              "$ref": "#/components/schemas/ObjectImportRunRow"
            }
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          },
          "updatedAt": {
            "type": "string",
            "format": "date-time"
          },
          "reason": {
            "type": "string",
            "enum": [
              "",
              "model_unavailable",
              "output_rejected",
              "creation_unavailable"
            ]
          },
          "createdCount": {
            "type": "integer",
            "minimum": 0
          },
          "needsReviewCount": {
            "type": "integer",
            "minimum": 0
          },
          "canReplaceSource": {
            "type": "boolean",
            "description": "The run is pending with a reported reason and has no frozen rows. Clients with an uncertain previous attempt must still retry the original source."
          }
        }
      }
    },
    "responses": {
      "ObjectImportError": {
        "description": "Rejected or unavailable. A failed confirm can have partial results; GET the same job and retry the original review version. SDK/source/provider details are not exposed. Cross-origin protection may return text/plain.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "../common/transport.yaml#/components/schemas/APIError"
            }
          },
          "text/plain": {
            "schema": {
              "type": "string"
            }
          }
        }
      }
    }
  }
}
