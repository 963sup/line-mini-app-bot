    "/api/v1/repositories/{repositoryId}/object-import-runs": {
      "post": {
        "operationId": "createObjectImportRun",
        "summary": "Automatically freeze validated model rows and create Objects; same intent key resumes partial results",
        "security": [
          {
            "bearerAuth": []
          },
          {
            "sessionCookie": []
          }
        ],
        "parameters": [
          {
            "in": "path",
            "name": "repositoryId",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            }
          },
          {
            "in": "header",
            "name": "X-CSRF-Token",
            "schema": {
              "type": "string"
            },
            "description": "Required for Cookie Session writes; existing authenticator validates."
          },
          {
            "in": "header",
            "name": "Idempotency-Key",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[A-Za-z0-9_-]{16,128}$"
            },
            "description": "Actor/repository scoped intent key. Same source intent resumes frozen rows without parsing again. Different intent conflicts; different keys may duplicate a document."
          }
        ],
        "responses": {
          "200": {
            "description": "Authorized current snapshot; no-store",
            "content": {
              "application/json": {
                "schema": {
