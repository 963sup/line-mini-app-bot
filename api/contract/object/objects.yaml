{
  "paths": {
    "/api/v1/repositories/{repositoryId}/objects": {
      "get": {
        "operationId": "listObjects",
        "summary": "List objects for a current repository member in ascending document-ID order",
        "security": [
          {
            "bearerAuth": []
          },
          {
            "sessionCookie": []
          }
        ],
        "parameters": [
          {
            "in": "path",
            "name": "repositoryId",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            }
          },
          {
            "in": "query",
            "name": "cursor",
            "schema": {
              "type": "string",
              "maxLength": 1024
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Authorized result; no-store",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ObjectPage"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/ObjectError"
          },
          "401": {
            "$ref": "#/components/responses/ObjectError"
          },
          "403": {
            "$ref": "#/components/responses/ObjectForbidden"
          },
          "404": {
            "$ref": "#/components/responses/ObjectError"
          },
          "409": {
            "$ref": "#/components/responses/ObjectError"
          },
          "415": {
            "$ref": "#/components/responses/ObjectError"
          },
          "503": {
            "$ref": "#/components/responses/ObjectError"
          }
        }
      },
      "post": {
        "operationId": "createObject",
        "summary": "Create an object with exact progress; server derives managed work status, no shared number",
        "security": [
          {
            "bearerAuth": []
          },
          {
            "sessionCookie": []
          }
        ],
        "parameters": [
          {
            "in": "path",
            "name": "repositoryId",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            }
          },
          {
            "in": "header",
            "name": "Idempotency-Key",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[A-Za-z0-9_-]{16,128}$"
            },
            "description": "Scoped to actor and repository within Object creation only. Reuse the original key after an unknown result; same key with different normalized content conflicts."
          },
          {
            "in": "header",
            "name": "X-CSRF-Token",
            "schema": {
              "type": "string"
            },
            "description": "Required for Cookie Session writes; validated by the existing session authenticator."
          }
        ],
        "responses": {
          "200": {
            "description": "Authorized result; no-store",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Object"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/ObjectError"
          },
          "401": {
            "$ref": "#/components/responses/ObjectError"
          },
          "403": {
            "$ref": "#/components/responses/ObjectForbidden"
          },
          "404": {
            "$ref": "#/components/responses/ObjectError"
          },
          "409": {
            "$ref": "#/components/responses/ObjectError"
          },
          "415": {
            "$ref": "#/components/responses/ObjectError"
          },
          "503": {
            "$ref": "#/components/responses/ObjectError"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ObjectCreation"
              }
            }
          }
        }
      }
    },
    "/api/v1/repositories/{repositoryId}/objects/{id}": {
      "get": {
        "operationId": "getObject",
        "summary": "Read an object as a current repository member",
        "security": [
          {
            "bearerAuth": []
          },
          {
            "sessionCookie": []
          }
        ],
        "parameters": [
          {
            "in": "path",
            "name": "repositoryId",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            }
          },
          {
            "in": "path",
            "name": "id",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Authorized result; no-store",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Object"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/ObjectError"
          },
          "401": {
            "$ref": "#/components/responses/ObjectError"
          },
          "403": {
            "$ref": "#/components/responses/ObjectForbidden"
          },
          "404": {
            "$ref": "#/components/responses/ObjectError"
          },
          "409": {
            "$ref": "#/components/responses/ObjectError"
          },
          "415": {
            "$ref": "#/components/responses/ObjectError"
          },
          "503": {
            "$ref": "#/components/responses/ObjectError"
          }
        }
      },
      "patch": {
        "operationId": "updateObject",
        "summary": "Creator updates content and absolute completed quantity with expectedVersion; legacy status remains compatible",
        "security": [
          {
            "bearerAuth": []
          },
          {
            "sessionCookie": []
          }
        ],
        "parameters": [
          {
            "in": "path",
            "name": "repositoryId",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            }
          },
          {
            "in": "path",
            "name": "id",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            }
          },
          {
            "in": "header",
            "name": "X-CSRF-Token",
            "schema": {
              "type": "string"
            },
            "description": "Required for Cookie Session writes; validated by the existing session authenticator."
          }
        ],
        "responses": {
          "200": {
            "description": "Authorized result; no-store",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Object"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/ObjectError"
          },
          "401": {
            "$ref": "#/components/responses/ObjectError"
          },
          "403": {
            "$ref": "#/components/responses/ObjectForbidden"
          },
          "404": {
            "$ref": "#/components/responses/ObjectError"
          },
          "409": {
            "$ref": "#/components/responses/ObjectError"
          },
          "415": {
            "$ref": "#/components/responses/ObjectError"
          },
          "503": {
            "$ref": "#/components/responses/ObjectError"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ObjectUpdate"
              }
            }
          }
        }
      }
    },
    "/api/v1/repositories/{repositoryId}/objects/candidates": {
      "post": {
        "operationId": "extractObjectCandidates",
        "summary": "Extract candidate objects from a document for member review",
        "security": [
          {
            "bearerAuth": []
          },
          {
            "sessionCookie": []
          }
        ],
        "parameters": [
          {
            "in": "path",
            "name": "repositoryId",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            }
          },
          {
            "in": "header",
            "name": "X-CSRF-Token",
            "schema": {
              "type": "string"
            },
            "description": "Required for Cookie Session writes; validated by the existing session authenticator."
          }
        ],
        "responses": {
          "200": {
            "description": "Authorized result; no-store",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ObjectCandidateResult"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/ObjectError"
          },
          "401": {
            "$ref": "#/components/responses/ObjectError"
          },
          "403": {
            "$ref": "#/components/responses/ObjectForbidden"
          },
          "404": {
            "$ref": "#/components/responses/ObjectError"
          },
          "409": {
            "$ref": "#/components/responses/ObjectError"
          },
          "415": {
            "$ref": "#/components/responses/ObjectError"
          },
          "503": {
            "$ref": "#/components/responses/ObjectError"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ObjectCandidateDocument"
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "Object": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "name",
          "description",
          "type",
          "unit",
          "sourceDocument",
          "sourceRevision",
          "sourceItemNo",
          "sourcePages",
          "materialCode",
          "quantity",
          "id",
          "repositoryId",
          "creatorId",
          "version",
          "createdAt",
          "updatedAt",
          "status",
          "canEdit",
          "requiresProgressReset"
        ],
        "properties": {
          "name": {
            "type": "string",
            "maxLength": 120,
            "minLength": 1
          },
          "description": {
            "type": "string",
            "maxLength": 8000
          },
          "type": {
            "type": "string",
            "maxLength": 80,
            "description": "Empty means unclassified; work or non_work when known. Historical free-form values remain supported."
          },
          "unit": {
            "type": "string",
            "maxLength": 32
          },
          "sourceDocument": {
            "type": "string",
            "maxLength": 200
          },
          "sourceRevision": {
            "type": "string",
            "maxLength": 80
          },
          "sourceItemNo": {
            "type": "string",
            "maxLength": 80
          },
          "sourcePages": {
            "type": "string",
            "maxLength": 80
          },
          "materialCode": {
            "type": "string",
            "maxLength": 120
          },
          "quantity": {
            "type": "string",
            "maxLength": 25,
            "pattern": "^$|^(0|[1-9][0-9]{0,17})(\\.[0-9]{1,6})?$",
            "description": "Empty means not yet specified; otherwise a positive exact decimal. No fabricated quantity."
          },
          "id": {
            "type": "string",
            "pattern": "^[a-f0-9]{32}$"
          },
          "repositoryId": {
            "type": "string",
            "pattern": "^[a-f0-9]{32}$"
          },
          "creatorId": {
            "type": "string"
          },
          "version": {
            "type": "integer",
            "format": "int64",
            "minimum": 1,
            "maximum": 9007199254740991
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          },
          "updatedAt": {
            "type": "string",
            "format": "date-time"
          },
          "status": {
            "type": "string",
            "enum": [
              "not_started",
              "in_progress",
              "completed"
            ],
            "description": "Derived from completedQuantity for managed work. For non_work this technical three-state value is retained only for compatibility; UI displays not applicable. Legacy records without progress retain their original status."
          },
          "completedQuantity": {
            "type": "string",
            "maxLength": 25,
            "pattern": "^(0|[1-9][0-9]{0,17})(\\.[0-9]{1,6})?$",
            "description": "Exact absolute completed quantity for work only; 0 <= completedQuantity <= quantity. Absent for non_work and legacy objects; new work defaults to 0. Omitted update preserves current value; conversion to work requires explicit value."
          },
          "spaceId": {
            "type": "string",
            "pattern": "^([a-f0-9]{32})?$",
            "description": "Optional repository-owned business Space ID, never a LINE Group ID. Empty means unassigned; omitted update preserves the current assignment. The server verifies the same repository and channel."
          },
          "canEdit": {
            "type": "boolean",
            "description": "Whether the authenticated actor may edit the content. Writes recheck authorization."
          },
          "requiresProgressReset": {
            "type": "boolean",
            "description": "Whether stored progress must be reset before changing the type to non-work."
          }
        }
      },
      "ObjectCreation": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "name"
        ],
        "properties": {
          "name": {
            "type": "string",
            "maxLength": 120,
            "minLength": 1
          },
          "description": {
            "type": "string",
            "maxLength": 8000
          },
          "type": {
            "type": "string",
            "maxLength": 80,
            "description": "Empty means unclassified; work or non_work when known. Historical free-form values remain supported."
          },
          "unit": {
            "type": "string",
            "maxLength": 32
          },
          "sourceDocument": {
            "type": "string",
            "maxLength": 200
          },
          "sourceRevision": {
            "type": "string",
            "maxLength": 80
          },
          "sourceItemNo": {
            "type": "string",
            "maxLength": 80
          },
          "sourcePages": {
            "type": "string",
            "maxLength": 80
          },
          "materialCode": {
            "type": "string",
            "maxLength": 120
          },
          "quantity": {
            "type": "string",
            "maxLength": 25,
            "pattern": "^$|^(0|[1-9][0-9]{0,17})(\\.[0-9]{1,6})?$",
            "description": "Empty means not yet specified; otherwise a positive exact decimal. No fabricated quantity."
          },
          "completedQuantity": {
            "type": "string",
            "maxLength": 25,
            "pattern": "^(0|[1-9][0-9]{0,17})(\\.[0-9]{1,6})?$",
            "description": "Exact absolute completed quantity for work only; 0 <= completedQuantity <= quantity. Absent for non_work and legacy objects; new work defaults to 0. Omitted update preserves current value; conversion to work requires explicit value."
          },
          "spaceId": {
            "type": "string",
            "pattern": "^([a-f0-9]{32})?$",
            "description": "Optional repository-owned business Space ID, never a LINE Group ID. Empty means unassigned; omitted update preserves the current assignment. The server verifies the same repository and channel."
          }
        },
        "description": "Create an object with its name only; classification, quantity, unit and space may be supplied later. No inferred defaults."
      },
      "ObjectUpdate": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "name",
          "description",
          "type",
          "quantity",
          "unit",
          "expectedVersion"
        ],
        "properties": {
          "name": {
            "type": "string",
            "maxLength": 120,
            "minLength": 1
          },
          "description": {
            "type": "string",
            "maxLength": 8000
          },
          "type": {
            "type": "string",
            "maxLength": 80,
            "description": "Empty means unclassified; work or non_work when known. Historical free-form values remain supported."
          },
          "unit": {
            "type": "string",
            "maxLength": 32
          },
          "sourceDocument": {
            "type": "string",
            "maxLength": 200,
            "description": "Omitted preserves current value; empty string clears. Provenance only, not a uniqueness key."
          },
          "sourceRevision": {
            "type": "string",
            "maxLength": 80,
            "description": "Omitted preserves current value; empty string clears. Provenance only, not a uniqueness key."
          },
          "sourceItemNo": {
            "type": "string",
            "maxLength": 80,
            "description": "Omitted preserves current value; empty string clears. Provenance only, not a uniqueness key."
          },
          "sourcePages": {
            "type": "string",
            "maxLength": 80,
            "description": "Omitted preserves current value; empty string clears. Provenance only, not a uniqueness key."
          },
          "materialCode": {
            "type": "string",
            "maxLength": 120,
            "description": "Omitted preserves current value; empty string clears. Provenance only, not a uniqueness key."
          },
          "quantity": {
            "type": "string",
            "maxLength": 25,
            "pattern": "^$|^(0|[1-9][0-9]{0,17})(\\.[0-9]{1,6})?$",
            "description": "Empty means not yet specified; otherwise a positive exact decimal. No fabricated quantity."
          },
          "status": {
            "type": "string",
            "enum": [
              "not_started",
              "in_progress",
              "completed"
            ],
            "description": "Optional legacy status. Work status is derived from completedQuantity; explicit contradictory status is rejected. Omission preserves historical status."
          },
          "expectedVersion": {
            "type": "integer",
            "format": "int64",
            "minimum": 1,
            "maximum": 9007199254740991
          },
          "completedQuantity": {
            "type": "string",
            "maxLength": 25,
            "pattern": "^(0|[1-9][0-9]{0,17})(\\.[0-9]{1,6})?$",
            "description": "Exact absolute completed quantity for work only; 0 <= completedQuantity <= quantity. Absent for non_work and legacy objects; new work defaults to 0. Omitted update preserves current value; conversion to work requires explicit value."
          },
          "spaceId": {
            "type": "string",
            "pattern": "^([a-f0-9]{32})?$",
            "description": "Optional repository-owned business Space ID, never a LINE Group ID. Empty means unassigned; omitted update preserves the current assignment. The server verifies the same repository and channel."
          }
        },
        "description": "Replace core content; omitted optional source fields preserve current values, explicit empty strings clear. No document revision automatically changes another object."
      },
      "ObjectPage": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "items",
          "nextCursor"
        ],
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Object"
            }
          },
          "nextCursor": {
            "type": "string",
            "description": "Empty when finished; at most twenty objects per page in document-ID ascending order."
          }
        }
      },
      "ObjectCandidateDocument": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "filename",
          "data"
        ],
        "properties": {
          "filename": {
            "type": "string",
            "minLength": 1
          },
          "data": {
            "type": "string",
            "format": "byte",
            "minLength": 4,
            "maxLength": 66666668
          }
        }
      },
      "ObjectCandidate": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "name",
          "quote"
        ],
        "properties": {
          "name": {
            "type": "string"
          },
          "quote": {
            "type": "string"
          },
          "location": {
            "type": "string"
          },
          "quantity": {
            "type": "string"
          },
          "unit": {
            "type": "string"
          }
        }
      },
      "ObjectCandidateResult": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "status",
          "candidates",
          "rawResponse"
        ],
        "properties": {
          "status": {
            "type": "string",
            "enum": [
              "completed",
              "refused",
              "incomplete",
              "invalid_output",
              "provider_error"
            ]
          },
          "candidates": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/ObjectCandidate"
            }
          },
          "rawResponse": {
            "type": "string"
          }
        }
      }
    },
    "responses": {
      "ObjectError": {
        "description": "Request rejected or unavailable; errors never expose hidden resources.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "../common/transport.yaml#/components/schemas/APIError"
            }
          }
        }
      },
      "ObjectForbidden": {
        "description": "Creator permission or CSRF denied. Standard cross-origin protection may return text/plain.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "../common/transport.yaml#/components/schemas/APIError"
            }
          },
          "text/plain": {
            "schema": {
              "type": "string"
            }
          }
        }
      }
    }
  },
  "x-owner": "object"
}
