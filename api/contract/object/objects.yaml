  "components": {
    "schemas": {
      "Object": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "name",
          "description",
          "type",
          "unit",
          "sourceDocument",
          "sourceRevision",
          "sourceItemNo",
          "sourcePages",
          "materialCode",
          "quantity",
          "id",
          "repositoryId",
          "creatorId",
          "version",
          "createdAt",
          "updatedAt",
          "status",
          "canEdit",
          "requiresProgressReset"
        ],
        "properties": {
          "name": {
            "type": "string",
            "maxLength": 120,
            "minLength": 1
          },
          "description": {
            "type": "string",
            "maxLength": 8000
          },
          "type": {
            "type": "string",
            "maxLength": 80,
            "description": "Empty means unclassified; work or non_work when known. Historical free-form values remain supported."
          },
          "unit": {
            "type": "string",
            "maxLength": 32
          },
          "sourceDocument": {
            "type": "string",
            "maxLength": 200
          },
          "sourceRevision": {
            "type": "string",
            "maxLength": 80
          },
          "sourceItemNo": {
            "type": "string",
            "maxLength": 80
          },
          "sourcePages": {
            "type": "string",
            "maxLength": 80
          },
          "materialCode": {
            "type": "string",
            "maxLength": 120
          },
          "quantity": {
            "type": "string",
            "maxLength": 25,
            "pattern": "^$|^(0|[1-9][0-9]{0,17})(\\.[0-9]{1,6})?$",
            "description": "Empty means not yet specified; otherwise a positive exact decimal. No fabricated quantity."
          },
          "id": {
            "type": "string",
            "pattern": "^[a-f0-9]{32}$"
          },
          "repositoryId": {
            "type": "string",
            "pattern": "^[a-f0-9]{32}$"
          },
          "creatorId": {
            "type": "string"
          },
          "version": {
            "type": "integer",
            "format": "int64",
            "minimum": 1,
            "maximum": 9007199254740991
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          },
          "updatedAt": {
            "type": "string",
            "format": "date-time"
          },
          "status": {
            "type": "string",
            "enum": [
              "not_started",
              "in_progress",
              "completed"
            ],
            "description": "Derived from completedQuantity for managed work. For non_work this technical three-state value is retained only for compatibility; UI displays not applicable. Legacy records without progress retain their original status."
          },
          "completedQuantity": {
            "type": "string",
            "maxLength": 25,
            "pattern": "^(0|[1-9][0-9]{0,17})(\\.[0-9]{1,6})?$",
