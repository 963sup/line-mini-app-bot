    "/api/v1/repositories/{repositoryId}/objects": {
      "get": {
        "operationId": "listObjects",
        "summary": "List objects for a current repository member in ascending document-ID order",
        "security": [
          {
            "bearerAuth": []
          },
          {
            "sessionCookie": []
          }
        ],
        "parameters": [
          {
            "in": "path",
            "name": "repositoryId",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            }
          },
          {
            "in": "query",
            "name": "parentId",
            "description": "Filter to direct children of this object.",
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            }
          },
          {
            "in": "query",
            "name": "cursor",
            "schema": {
              "type": "string",
              "maxLength": 1024
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Authorized result; no-store",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ObjectPage"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/ObjectError"
          },
          "401": {
            "$ref": "#/components/responses/ObjectError"
          },
          "403": {
            "$ref": "#/components/responses/ObjectForbidden"
          },
          "404": {
            "$ref": "#/components/responses/ObjectError"
          },
          "409": {
            "$ref": "#/components/responses/ObjectError"
          },
          "415": {
            "$ref": "#/components/responses/ObjectError"
          },
          "503": {
            "$ref": "#/components/responses/ObjectError"
          }
        }
      },
      "post": {
        "operationId": "createObject",
        "summary": "Create an object with exact progress; server derives managed work status, no shared number",
        "security": [
          {
            "bearerAuth": []
          },
          {
            "sessionCookie": []
          }
        ],
        "parameters": [
          {
            "in": "path",
            "name": "repositoryId",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            }
          },
          {
            "in": "header",
            "name": "Idempotency-Key",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[A-Za-z0-9_-]{16,128}$"
            },
            "description": "Scoped to actor and repository within Object creation only. Reuse the original key after an unknown result; same key with different normalized content conflicts."
          },
          {
            "in": "header",
            "name": "X-CSRF-Token",
            "schema": {
              "type": "string"
            },
            "description": "Required for Cookie Session writes; validated by the existing session authenticator."
          }
        ],
        "responses": {
          "200": {
            "description": "Authorized result; no-store",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Object"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/ObjectError"
          },
          "401": {
            "$ref": "#/components/responses/ObjectError"
          },
          "403": {
            "$ref": "#/components/responses/ObjectForbidden"
          },
          "404": {
            "$ref": "#/components/responses/ObjectError"
          },
          "409": {
            "$ref": "#/components/responses/ObjectError"
          },
          "415": {
            "$ref": "#/components/responses/ObjectError"
          },
          "503": {
            "$ref": "#/components/responses/ObjectError"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ObjectCreation"
              }
            }
          }
        }
      }
    },
