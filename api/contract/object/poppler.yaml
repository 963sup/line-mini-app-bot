{
  "paths": {
    "/api/v1/tools/poppler/extractions": {
      "post": {
        "operationId": "ExtractPopplerText",
        "tags": [
          "object"
        ],
        "summary": "Extract standardized PDF text without saving",
        "security": [
          {
            "bearerAuth": []
          },
          {
            "sessionCookie": []
          }
        ],
        "parameters": [
          {
            "name": "X-CSRF-Token",
            "in": "header",
            "schema": {
              "type": "string"
            },
            "description": "Required for cookie sessions."
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/PopplerDocument"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Standardized text; empty text does not imply OCR is required.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PopplerText"
                }
              }
            }
          },
          "400": {
            "description": "Request rejected or extraction failed.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../common/transport.yaml#/components/schemas/APIError"
                }
              }
            }
          },
          "401": {
