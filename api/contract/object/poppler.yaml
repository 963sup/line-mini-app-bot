        }
      }
    }
  },
  "components": {
    "schemas": {
      "PopplerDocument": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "filename",
          "data"
        ],
        "properties": {
          "filename": {
            "type": "string",
            "minLength": 1,
            "maxLength": 255
          },
          "data": {
            "type": "string",
            "format": "byte",
            "maxLength": 11184812
          }
        }
      },
      "PopplerText": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "text"
        ],
        "properties": {
          "text": {
            "type": "string"
          }
        }
      }
    }
  },
  "x-owner": "operations"
