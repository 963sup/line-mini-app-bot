{
  "openapi": "3.0.3",
  "info": {
    "title": "LINE MINI App API",
    "version": "1.0.0",
    "description": "HTTP contract for MINI App identity and attendance. Preserve existing field casing, nullable arrays, legacy routes, complete monthly totals and idempotent correction semantics."
  },
  "servers": [
    {
      "url": "/"
    }
  ],
  "paths": {
    "/api/v1/miniapp/config": {
      "get": {
        "operationId": "getMiniAppConfig",
        "summary": "MiniAppConfig",
        "security": [],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MiniAppConfig"
                }
              }
            }
          },
          "503": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/APIError"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/me": {
      "get": {
        "operationId": "getCurrentUser",
        "summary": "CurrentUser",
        "security": [
          {
            "bearerAuth": []
          },
          {
            "sessionCookie": []
          }
        ],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CurrentUser"
                }
              }
            }
          },
          "401": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/APIError"
                }
              }
            }
          },
          "503": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/APIError"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/attendance/groups": {
      "$ref": "./attendance/records.yaml#/paths/~1api~1v1~1attendance~1groups"
    },
    "/api/v1/attendance/groups/page": {
      "$ref": "./attendance/records.yaml#/paths/~1api~1v1~1attendance~1groups~1page"
    },
    "/api/v1/attendance/records": {
      "$ref": "./attendance/records.yaml#/paths/~1api~1v1~1attendance~1records"
    },
    "/api/v1/attendance/records/{id}": {
      "$ref": "./attendance/records.yaml#/paths/~1api~1v1~1attendance~1records~1{id}"
    },
    "/api/v1/attendance/monthly": {
      "$ref": "./attendance/records.yaml#/paths/~1api~1v1~1attendance~1monthly"
    },
    "/api/v1/attendance/monthly/summary": {
      "$ref": "./attendance/records.yaml#/paths/~1api~1v1~1attendance~1monthly~1summary"
    },
    "/api/v1/attendance/launch": {
      "$ref": "./attendance/punch.yaml#/paths/~1api~1v1~1attendance~1launch"
    },
    "/api/v1/attendance/punches": {
      "$ref": "./attendance/punch.yaml#/paths/~1api~1v1~1attendance~1punches"
    },
    "/api/v1/attendance/corrections": {
      "$ref": "./attendance/corrections.yaml#/paths/~1api~1v1~1attendance~1corrections"
    },
    "/api/v1/attendance/corrections/{id}": {
      "$ref": "./attendance/corrections.yaml#/paths/~1api~1v1~1attendance~1corrections~1{id}"
    },
    "/api/v1/attendance/corrections/{id}/review": {
      "$ref": "./attendance/approvals.yaml#/paths/~1api~1v1~1attendance~1corrections~1{id}~1review"
    },
    "/api/v1/attendance/corrections/{id}/approve": {
      "$ref": "./attendance/approvals.yaml#/paths/~1api~1v1~1attendance~1corrections~1{id}~1approve"
    },
    "/api/v1/session": {
      "post": {
        "operationId": "createSession",
        "summary": "Exchange a verified LINE ID token for a browser session",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "parameters": [
          {
            "in": "header",
            "name": "Origin",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Session created; response is not cacheable",
            "headers": {
              "Set-Cookie": {
                "schema": {
                  "type": "string"
                },
                "description": "Secure HttpOnly __Host-session cookie"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SessionResponse"
                }
              }
            }
          },
          "400": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/APIError"
                }
              }
            }
          },
          "401": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/APIError"
                }
              }
            }
          },
          "403": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/APIError"
                }
              }
            }
          },
          "415": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/APIError"
                }
              }
            }
          },
          "503": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/APIError"
                }
              }
            }
          }
        }
      },
      "delete": {
        "operationId": "deleteSession",
        "summary": "Revoke browser session before clearing its cookie",
        "security": [
          {
            "sessionCookie": []
          }
        ],
        "parameters": [
          {
            "in": "header",
            "name": "Origin",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "in": "header",
            "name": "X-CSRF-Token",
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "204": {
            "description": "Session revoked or already absent"
          },
          "401": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/APIError"
                }
              }
            }
          },
          "403": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/APIError"
                }
              }
            }
          },
          "503": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/APIError"
                }
              }
            }
          },
          "400": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/APIError"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/session/refresh": {
      "post": {
        "operationId": "refreshSession",
        "summary": "Renew a valid browser session within its absolute lifetime",
        "security": [
          {
            "sessionCookie": []
          }
        ],
        "parameters": [
          {
            "in": "header",
            "name": "Origin",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "in": "header",
            "name": "X-CSRF-Token",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Current session expiry, extended when eligible; ID and CSRF remain unchanged",
            "headers": {
              "Set-Cookie": {
                "schema": {
                  "type": "string"
                },
                "description": "Secure HttpOnly __Host-session cookie"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SessionResponse"
                }
              }
            }
          },
          "400": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/APIError"
                }
              }
            }
          },
          "401": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/APIError"
                }
              }
            }
          },
          "403": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/APIError"
                }
              }
            }
          },
          "415": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/APIError"
                }
              }
            }
          },
          "503": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/APIError"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/attendance/leaves": {
      "$ref": "./attendance/leave.yaml#/paths/~1api~1v1~1attendance~1leaves"
    },
    "/api/v1/attendance/punches/preflight": {
      "$ref": "./attendance/punch.yaml#/paths/~1api~1v1~1attendance~1punches~1preflight"
    },
    "/api/v1/attendance/corrections/{id}/reject": {
      "$ref": "./attendance/approvals.yaml#/paths/~1api~1v1~1attendance~1corrections~1{id}~1reject"
    },
    "/api/v1/attendance/corrections/{id}/cancel": {
      "$ref": "./attendance/corrections.yaml#/paths/~1api~1v1~1attendance~1corrections~1{id}~1cancel"
    },
    "/api/v1/attendance/corrections/reviewer-groups": {
      "$ref": "./attendance/approvals.yaml#/paths/~1api~1v1~1attendance~1corrections~1reviewer-groups"
    },
    "/api/v1/repositories": {
      "get": {
        "operationId": "listRepositories",
        "summary": "List repositories from verified group interactions; current membership is rechecked",
        "security": [
          {
            "bearerAuth": []
          },
          {
            "sessionCookie": []
          }
        ],
        "parameters": [
          {
            "in": "query",
            "name": "cursor",
            "schema": {
              "type": "string",
              "maxLength": 1024
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Authorized repository data; no-store",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/RepositoryPage"
                }
              }
            }
          },
          "400": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/APIError"
                }
              }
            }
          },
          "401": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/APIError"
                }
              }
            }
          },
          "404": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/APIError"
                }
              }
            }
          },
          "503": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/APIError"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/repositories/{id}": {
      "get": {
        "operationId": "getRepository",
        "summary": "Read a repository as a current group member",
        "security": [
          {
            "bearerAuth": []
          },
          {
            "sessionCookie": []
          }
        ],
        "parameters": [
          {
            "in": "path",
            "name": "id",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Authorized repository data; no-store",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Repository"
                }
              }
            }
          },
          "400": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/APIError"
                }
              }
            }
          },
          "401": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/APIError"
                }
              }
            }
          },
          "404": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/APIError"
                }
              }
            }
          },
          "503": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/APIError"
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer"
      },
      "sessionCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "__Host-session",
        "description": "Server session with sliding expiry capped by the verified LINE token and absolute lifetime. Unsafe requests require same-origin Origin and X-CSRF-Token."
      }
    },
    "schemas": {
      "APIError": {
        "type": "object",
        "required": [
          "error"
        ],
        "properties": {
          "error": {
            "type": "object",
            "required": [
              "code",
              "message"
            ],
            "properties": {
              "code": {
                "type": "string"
              },
              "message": {
                "type": "string"
              }
            }
          }
        }
      },
      "MiniAppConfig": {
        "type": "object",
        "required": [
          "liffId"
        ],
        "properties": {
          "liffId": {
            "type": "string"
          }
        }
      },
      "CurrentUser": {
        "type": "object",
        "required": [
          "userId",
          "displayName"
        ],
        "properties": {
          "userId": {
            "type": "string"
          },
          "displayName": {
            "type": "string"
          }
        }
      },
      "SessionResponse": {
        "type": "object",
        "required": [
          "user",
          "csrfToken",
          "expiresAt"
        ],
        "properties": {
          "user": {
            "$ref": "#/components/schemas/CurrentUser"
          },
          "csrfToken": {
            "type": "string",
            "minLength": 43,
            "maxLength": 43
          },
          "expiresAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "Repository": {
        "type": "object",
        "required": [
          "id",
          "groupId",
          "name",
          "status",
          "createdAt",
          "updatedAt",
          "version"
        ],
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^[a-f0-9]{32}$"
          },
          "groupId": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "status": {
            "type": "string",
            "enum": [
              "ACTIVE",
              "INACTIVE"
            ]
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          },
          "updatedAt": {
            "type": "string",
            "format": "date-time"
          },
          "version": {
            "type": "integer",
            "format": "int64",
            "minimum": 1
          }
        }
      },
      "RepositoryPage": {
        "type": "object",
        "required": [
          "items",
          "nextCursor"
        ],
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Repository"
            }
          },
          "nextCursor": {
            "type": "string",
            "description": "Empty when finished. Pages may be empty after current-membership filtering."
          }
        }
      }
    }
  }
}
