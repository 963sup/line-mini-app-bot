  "components": {
    "schemas": {
      "OrganizationOption": {
        "type": "object",
        "required": [
          "organizationId",
          "name",
          "detail"
        ],
        "properties": {
          "organizationId": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "detail": {
            "type": "string",
            "nullable": true
          }
        }
      },
      "SelectedOrganization": {
        "type": "object",
        "required": [
          "organizationId",
          "name",
          "groupLabel"
        ],
        "properties": {
          "organizationId": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "groupLabel": {
            "type": "string"
          }
        }
      },
      "OrganizationGroup": {
        "type": "object",
        "required": [
          "enterpriseId",
          "label",
          "organizations"
        ],
        "properties": {
          "enterpriseId": {
            "type": "string",
            "nullable": true
          },
          "label": {
            "type": "string"
          },
          "organizations": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/OrganizationOption"
            }
          }
        }
      },
      "OrganizationContext": {
        "type": "object",
        "required": [
          "groups",
          "selected",
          "canSwitch"
        ],
        "properties": {
          "groups": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/OrganizationGroup"
            }
          },
          "selected": {
            "allOf": [
              {
                "$ref": "#/components/schemas/SelectedOrganization"
              }
            ],
            "nullable": true,
            "type": "object"
          },
          "canSwitch": {
            "type": "boolean"
          }
        }
      },
      "SelectOrganizationRequest": {
        "type": "object",
        "required": [
          "organizationId"
        ],
        "properties": {
          "organizationId": {
            "type": "string"
          }
        }
      },
      "Organization": {
        "type": "object",
        "required": [
          "organizationId",
          "name",
          "ownerUserId"
        ],
        "properties": {
          "organizationId": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "ownerUserId": {
            "type": "string"
          }
        }
      },
      "CreateOrganizationRequest": {
        "type": "object",
        "required": [
          "name"
        ],
        "properties": {
          "name": {
            "type": "string"
          }
        }
      },
      "TransferOrganizationRequest": {
        "type": "object",
        "required": [
          "userId"
        ],
        "properties": {
          "userId": {
            "type": "string"
          }
        }
      },
      "TeamManagement": {
        "type": "object",
        "required": [
          "managementScope",
          "managementId"
        ],
        "properties": {
          "managementScope": {
            "type": "string",
            "enum": [
              "organization",
              "enterprise"
            ]
          },
          "managementId": {
            "type": "string"
          }
        }
      },
      "OrganizationTeamOption": {
        "type": "object",
        "required": [
          "teamId",
          "name",
          "managementScope"
        ],
        "properties": {
          "teamId": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "managementScope": {
            "type": "string"
          }
        }
      },
      "OrganizationTeamsResponse": {
        "type": "object",
        "required": [
          "teams"
        ],
        "properties": {
          "teams": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/OrganizationTeamOption"
            }
          }
        }
      }
    }
  }
