{
  "paths": {
    "/api/v1/owners/{ownerId}/projects/{id}/references": {
      "get": {
        "operationId": "listProjectReferences",
        "summary": "listProjectReferences",
        "security": [
          {
            "bearerAuth": []
          },
          {
            "sessionCookie": []
          }
        ],
        "parameters": [
          {
            "in": "path",
            "name": "ownerId",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[UC][a-f0-9]{32}$"
            }
          },
          {
            "in": "path",
            "name": "id",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            }
          },
          {
            "in": "query",
            "name": "cursor",
            "schema": {
              "type": "string",
              "maxLength": 1024
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Authorized result; no-store",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ProjectReferencePage"
                }
              }
            }
          },
          "400": {
            "$ref": "./items.yaml#/components/responses/ProjectError"
          },
          "401": {
            "$ref": "./items.yaml#/components/responses/ProjectError"
          },
          "403": {
            "$ref": "./items.yaml#/components/responses/ProjectForbidden"
          },
          "404": {
            "$ref": "./items.yaml#/components/responses/ProjectError"
          },
          "409": {
            "$ref": "./items.yaml#/components/responses/ProjectError"
          },
          "415": {
            "$ref": "./items.yaml#/components/responses/ProjectError"
          },
          "503": {
            "$ref": "./items.yaml#/components/responses/ProjectError"
          }
        }
      },
      "post": {
        "operationId": "addProjectReference",
        "summary": "addProjectReference",
        "security": [
          {
            "bearerAuth": []
          },
          {
            "sessionCookie": []
          }
        ],
        "parameters": [
          {
            "in": "path",
            "name": "ownerId",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[UC][a-f0-9]{32}$"
            }
          },
          {
            "in": "path",
            "name": "id",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            }
          },
          {
            "in": "header",
            "name": "X-CSRF-Token",
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Authorized result; no-store",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "./projects.yaml#/components/schemas/Project"
                }
              }
            }
          },
          "400": {
            "$ref": "./items.yaml#/components/responses/ProjectError"
          },
          "401": {
            "$ref": "./items.yaml#/components/responses/ProjectError"
          },
          "403": {
            "$ref": "./items.yaml#/components/responses/ProjectForbidden"
          },
          "404": {
            "$ref": "./items.yaml#/components/responses/ProjectError"
          },
          "409": {
            "$ref": "./items.yaml#/components/responses/ProjectError"
          },
          "415": {
            "$ref": "./items.yaml#/components/responses/ProjectError"
          },
          "503": {
            "$ref": "./items.yaml#/components/responses/ProjectError"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ProjectReferenceAddition"
              }
            }
          }
        }
      }
    },
    "/api/v1/owners/{ownerId}/projects/{id}/references/{itemId}": {
      "delete": {
        "operationId": "removeProjectReference",
        "summary": "removeProjectReference",
        "security": [
          {
            "bearerAuth": []
          },
          {
            "sessionCookie": []
          }
        ],
        "parameters": [
          {
            "in": "path",
            "name": "ownerId",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[UC][a-f0-9]{32}$"
            }
          },
          {
            "in": "path",
            "name": "id",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            }
          },
          {
            "in": "path",
            "name": "itemId",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            }
          },
          {
            "in": "query",
            "name": "expectedVersion",
            "required": true,
            "schema": {
              "type": "integer",
              "format": "int64",
              "minimum": 1,
              "maximum": 9007199254740991
            }
          },
          {
            "in": "header",
            "name": "X-CSRF-Token",
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Authorized result; no-store",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "./projects.yaml#/components/schemas/Project"
                }
              }
            }
          },
          "400": {
            "$ref": "./items.yaml#/components/responses/ProjectError"
          },
          "401": {
            "$ref": "./items.yaml#/components/responses/ProjectError"
          },
          "403": {
            "$ref": "./items.yaml#/components/responses/ProjectForbidden"
          },
          "404": {
            "$ref": "./items.yaml#/components/responses/ProjectError"
          },
          "409": {
            "$ref": "./items.yaml#/components/responses/ProjectError"
          },
          "415": {
            "$ref": "./items.yaml#/components/responses/ProjectError"
          },
          "503": {
            "$ref": "./items.yaml#/components/responses/ProjectError"
          }
        }
      }
    },
    "/api/v1/owners/{ownerId}/projects/{id}/reference-state": {
      "get": {
        "operationId": "getProjectReferenceState",
        "summary": "Check current reference state without inferring historical operation success",
        "security": [
          {
            "bearerAuth": []
          },
          {
            "sessionCookie": []
          }
        ],
        "parameters": [
          {
            "in": "path",
            "name": "ownerId",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[UC][a-f0-9]{32}$"
            }
          },
          {
            "in": "path",
            "name": "id",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            }
          },
          {
            "in": "query",
            "name": "desiredPresent",
            "required": true,
            "schema": {
              "type": "boolean"
            }
          },
          {
            "in": "query",
            "name": "itemId",
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            }
          },
          {
            "in": "query",
            "name": "sourceRepositoryId",
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            }
          },
          {
            "in": "query",
            "name": "sourceType",
            "schema": {
              "type": "string",
              "enum": [
                "object",
                "issue",
                "discussion"
              ]
            }
          },
          {
            "in": "query",
            "name": "sourceId",
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Authorized result; no-store",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ProjectReferenceState"
                }
              }
            }
          },
          "400": {
            "$ref": "./items.yaml#/components/responses/ProjectError"
          },
          "401": {
            "$ref": "./items.yaml#/components/responses/ProjectError"
          },
          "403": {
            "$ref": "./items.yaml#/components/responses/ProjectForbidden"
          },
          "404": {
            "$ref": "./items.yaml#/components/responses/ProjectError"
          },
          "409": {
            "$ref": "./items.yaml#/components/responses/ProjectError"
          },
          "415": {
            "$ref": "./items.yaml#/components/responses/ProjectError"
          },
          "503": {
            "$ref": "./items.yaml#/components/responses/ProjectError"
          }
        },
        "description": "Creator-only read. Supply either itemId or sourceRepositoryId/sourceType/sourceId. Returns whether the current presence matches desiredPresent; this is not an operation receipt. No source content is returned."
      }
    }
  },
  "components": {
    "schemas": {
      "ProjectReference": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "sourceType",
          "sourceId",
          "sourceRepositoryId",
          "sourceUnavailable",
          "sourceTitle",
          "sourceState",
          "inspectionMode"
        ],
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^[a-f0-9]{32}$"
          },
          "sourceType": {
            "type": "string",
            "enum": [
              "object",
              "issue",
              "discussion"
            ]
          },
          "sourceId": {
            "type": "string",
            "pattern": "^[a-f0-9]{32}$"
          },
          "sourceRepositoryId": {
            "type": "string",
            "pattern": "^[a-f0-9]{32}$"
          },
          "sourceUnavailable": {
            "type": "boolean"
          },
          "sourceTitle": {
            "type": "string"
          },
          "sourceState": {
            "type": "string"
          },
          "quantity": {
            "type": "string"
          },
          "unit": {
            "type": "string"
          },
          "completedQuantity": {
            "type": "string"
          },
          "type": {
            "type": "string"
          },
          "itemStatus": {
            "$ref": "./projects.yaml#/components/schemas/ProjectItemStatus"
          },
          "inspectionMode": {
            "type": "string",
            "enum": [
              "none",
              "history_only",
              "submit_if_empty"
            ],
            "description": "Inspection controls for this reference. A new submission requires an empty inspection history and the server rechecks source access at write time."
          }
        }
      },
      "ProjectReferencePage": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "items",
          "nextCursor"
        ],
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/ProjectReference"
            }
          },
          "nextCursor": {
            "type": "string"
          }
        }
      },
      "ProjectReferenceAddition": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "sourceType",
          "sourceId",
          "expectedVersion"
        ],
        "properties": {
          "sourceType": {
            "type": "string",
            "enum": [
              "object",
              "issue",
              "discussion"
            ]
          },
          "sourceId": {
            "type": "string",
            "pattern": "^[a-f0-9]{32}$"
          },
          "expectedVersion": {
            "type": "integer",
            "format": "int64",
            "minimum": 1,
            "maximum": 9007199254740991
          },
          "sourceRepositoryId": {
            "type": "string",
            "pattern": "^[a-f0-9]{32}$"
          }
        },
        "description": "Reference only within the Project source repository. Child objects use their own sourceId. Duplicate source identity is a no-op after current authorization, including retries of an unknown successful add."
      },
      "ProjectReferenceState": {
        "type": "object",
        "required": [
          "matches",
          "present"
        ],
        "properties": {
          "matches": {
            "type": "boolean"
          },
          "present": {
            "type": "boolean"
          }
        }
      }
    }
  }
}
