{
  "paths": {
    "/api/v1/repositories/{repositoryId}/milestones": {
      "get": {
        "operationId": "listMilestones",
        "summary": "listMilestones: current repository members read/create; creator-only versioned updates",
        "security": [
          {
            "bearerAuth": []
          },
          {
            "sessionCookie": []
          }
        ],
        "parameters": [
          {
            "in": "path",
            "name": "repositoryId",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            }
          },
          {
            "in": "query",
            "name": "cursor",
            "schema": {
              "type": "string",
              "maxLength": 1024
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Authorized result; no-store",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MilestonePage"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/MilestoneError"
          },
          "401": {
            "$ref": "#/components/responses/MilestoneError"
          },
          "403": {
            "$ref": "#/components/responses/MilestoneForbidden"
          },
          "404": {
            "$ref": "#/components/responses/MilestoneError"
          },
          "409": {
            "$ref": "#/components/responses/MilestoneError"
          },
          "415": {
            "$ref": "#/components/responses/MilestoneError"
          },
          "503": {
            "$ref": "#/components/responses/MilestoneError"
          }
        }
      },
      "post": {
        "operationId": "createMilestone",
        "summary": "createMilestone: current repository members read/create; creator-only versioned updates",
        "security": [
          {
            "bearerAuth": []
          },
          {
            "sessionCookie": []
          }
        ],
        "parameters": [
          {
            "in": "path",
            "name": "repositoryId",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            }
          },
          {
            "in": "header",
            "name": "Idempotency-Key",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[A-Za-z0-9_-]{16,128}$"
            },
            "description": "Reuse the same key and normalized content after an ambiguous result. Scoped to the verified actor and repository across resource types."
          },
          {
            "in": "header",
            "name": "X-CSRF-Token",
            "schema": {
              "type": "string"
            },
            "description": "Required for Cookie Session writes; validated by the existing session authenticator."
          }
        ],
        "responses": {
          "200": {
            "description": "Authorized result; no-store",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Milestone"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/MilestoneError"
          },
          "401": {
            "$ref": "#/components/responses/MilestoneError"
          },
          "403": {
            "$ref": "#/components/responses/MilestoneForbidden"
          },
          "404": {
            "$ref": "#/components/responses/MilestoneError"
          },
          "409": {
            "$ref": "#/components/responses/MilestoneError"
          },
          "415": {
            "$ref": "#/components/responses/MilestoneError"
          },
          "503": {
            "$ref": "#/components/responses/MilestoneError"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/MilestoneCreation"
              }
            }
          }
        }
      }
    },
    "/api/v1/repositories/{repositoryId}/milestones/{id}": {
      "get": {
        "operationId": "getMilestone",
        "summary": "getMilestone: current repository members read/create; creator-only versioned updates",
        "security": [
          {
            "bearerAuth": []
          },
          {
            "sessionCookie": []
          }
        ],
        "parameters": [
          {
            "in": "path",
            "name": "repositoryId",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            }
          },
          {
            "in": "path",
            "name": "id",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Authorized result; no-store",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Milestone"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/MilestoneError"
          },
          "401": {
            "$ref": "#/components/responses/MilestoneError"
          },
          "403": {
            "$ref": "#/components/responses/MilestoneForbidden"
          },
          "404": {
            "$ref": "#/components/responses/MilestoneError"
          },
          "409": {
            "$ref": "#/components/responses/MilestoneError"
          },
          "415": {
            "$ref": "#/components/responses/MilestoneError"
          },
          "503": {
            "$ref": "#/components/responses/MilestoneError"
          }
        }
      },
      "patch": {
        "operationId": "updateMilestone",
        "summary": "updateMilestone: current repository members read/create; creator-only versioned updates",
        "security": [
          {
            "bearerAuth": []
          },
          {
            "sessionCookie": []
          }
        ],
        "parameters": [
          {
            "in": "path",
            "name": "repositoryId",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            }
          },
          {
            "in": "path",
            "name": "id",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            }
          },
          {
            "in": "header",
            "name": "X-CSRF-Token",
            "schema": {
              "type": "string"
            },
            "description": "Required for Cookie Session writes; validated by the existing session authenticator."
          }
        ],
        "responses": {
          "200": {
            "description": "Authorized result; no-store",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Milestone"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/MilestoneError"
          },
          "401": {
            "$ref": "#/components/responses/MilestoneError"
          },
          "403": {
            "$ref": "#/components/responses/MilestoneForbidden"
          },
          "404": {
            "$ref": "#/components/responses/MilestoneError"
          },
          "409": {
            "$ref": "#/components/responses/MilestoneError"
          },
          "415": {
            "$ref": "#/components/responses/MilestoneError"
          },
          "503": {
            "$ref": "#/components/responses/MilestoneError"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/MilestoneUpdate"
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "Milestone": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "repositoryId",
          "title",
          "body",
          "creatorId",
          "version",
          "createdAt",
          "updatedAt",
          "dueDate",
          "state",
          "issueCount",
          "completedIssueCount"
        ],
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^[a-f0-9]{32}$"
          },
          "repositoryId": {
            "type": "string",
            "pattern": "^[a-f0-9]{32}$"
          },
          "title": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "body": {
            "type": "string",
            "maxLength": 8000
          },
          "creatorId": {
            "type": "string",
            "minLength": 1
          },
          "version": {
            "type": "integer",
            "format": "int64",
            "minimum": 1,
            "maximum": 9007199254740991
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          },
          "updatedAt": {
            "type": "string",
            "format": "date-time"
          },
          "dueDate": {
            "type": "string",
            "maxLength": 10,
            "pattern": "^(|[0-9]{4}-[0-9]{2}-[0-9]{2})$",
            "description": "Calendar date YYYY-MM-DD or empty; no timezone conversion"
          },
          "state": {
            "type": "string",
            "enum": [
              "open",
              "completed"
            ]
          },
          "issueCount": {
            "type": "integer",
            "format": "int64",
            "minimum": 0,
            "maximum": 9007199254740991
          },
          "completedIssueCount": {
            "type": "integer",
            "format": "int64",
            "minimum": 0,
            "maximum": 9007199254740991
          }
        }
      },
      "MilestoneCreation": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "title",
          "body",
          "dueDate"
        ],
        "properties": {
          "title": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "body": {
            "type": "string",
            "maxLength": 8000
          },
          "dueDate": {
            "type": "string",
            "maxLength": 10,
            "pattern": "^(|[0-9]{4}-[0-9]{2}-[0-9]{2})$",
            "description": "Calendar date YYYY-MM-DD or empty; no timezone conversion"
          }
        }
      },
      "MilestoneUpdate": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "title",
          "body",
          "expectedVersion",
          "dueDate",
          "state"
        ],
        "properties": {
          "title": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "body": {
            "type": "string",
            "maxLength": 8000
          },
          "expectedVersion": {
            "type": "integer",
            "format": "int64",
            "minimum": 1,
            "maximum": 9007199254740991
          },
          "dueDate": {
            "type": "string",
            "maxLength": 10,
            "pattern": "^(|[0-9]{4}-[0-9]{2}-[0-9]{2})$",
            "description": "Calendar date YYYY-MM-DD or empty; no timezone conversion"
          },
          "state": {
            "type": "string",
            "enum": [
              "open",
              "completed"
            ]
          }
        }
      },
      "MilestonePage": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "items",
          "nextCursor"
        ],
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Milestone"
            }
          },
          "nextCursor": {
            "type": "string",
            "description": "Empty when finished. Pages inspect at most twenty candidates and may be empty after filtering; continue while nextCursor is nonempty."
          }
        }
      }
    },
    "responses": {
      "MilestoneError": {
        "description": "Request rejected or unavailable; errors never expose hidden resources.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "../common/transport.yaml#/components/schemas/APIError"
            }
          }
        }
      },
      "MilestoneForbidden": {
        "description": "Creator permission or CSRF denied. Standard cross-origin protection may return text/plain.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "../common/transport.yaml#/components/schemas/APIError"
            }
          },
          "text/plain": {
            "schema": {
              "type": "string"
            }
          }
        }
      }
    }
  }
}
