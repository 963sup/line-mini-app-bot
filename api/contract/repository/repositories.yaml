{
  "paths": {
    "/api/v1/repositories": {
      "get": {
        "operationId": "listRepositories",
        "summary": "List repositories from verified group interactions; current membership is rechecked",
        "security": [
          {
            "bearerAuth": []
          },
          {
            "sessionCookie": []
          }
        ],
        "parameters": [
          {
            "in": "query",
            "name": "ownerId",
            "description": "Restrict the authorized discovery results to this owner. Continue with nextCursor even when a page is empty.",
            "schema": {
              "type": "string",
              "pattern": "^[UC][a-f0-9]{32}$"
            }
          },
          {
            "in": "query",
            "name": "cursor",
            "schema": {
              "type": "string",
              "maxLength": 1024
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Only active repositories readable by the current user; an empty page may have a nextCursor; no-store",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/RepositoryPage"
                }
              }
            }
          },
          "400": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "./../common/transport.yaml#/components/schemas/APIError"
                }
              }
            }
          },
          "401": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "./../common/transport.yaml#/components/schemas/APIError"
                }
              }
            }
          },
          "404": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "./../common/transport.yaml#/components/schemas/APIError"
                }
              }
            }
          },
          "503": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "./../common/transport.yaml#/components/schemas/APIError"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/repositories/{id}": {
      "get": {
        "operationId": "getRepository",
        "summary": "Read a repository as a current group member",
        "security": [
          {
            "bearerAuth": []
          },
          {
            "sessionCookie": []
          }
        ],
        "parameters": [
          {
            "in": "path",
            "name": "id",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Active repository readable by the current user; no-store",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Repository"
                }
              }
            }
          },
          "400": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "./../common/transport.yaml#/components/schemas/APIError"
                }
              }
            }
          },
          "401": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "./../common/transport.yaml#/components/schemas/APIError"
                }
              }
            }
          },
          "404": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "./../common/transport.yaml#/components/schemas/APIError"
                }
              }
            }
          },
          "503": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "./../common/transport.yaml#/components/schemas/APIError"
                }
              }
            }
          }
        }
      },
      "patch": {
        "operationId": "updateRepositoryAddress",
        "summary": "Update the address of an active repository after current access and version checks",
        "security": [
          {
            "bearerAuth": []
          },
          {
            "sessionCookie": []
          }
        ],
        "parameters": [
          {
            "in": "path",
            "name": "id",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/RepositoryAddressUpdate"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Address updated; retry only with the returned version",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Repository"
                }
              }
            }
          },
          "400": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "./../common/transport.yaml#/components/schemas/APIError"
                }
              }
            }
          },
          "401": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "./../common/transport.yaml#/components/schemas/APIError"
                }
              }
            }
          },
          "404": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "./../common/transport.yaml#/components/schemas/APIError"
                }
              }
            }
          },
          "409": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "./../common/transport.yaml#/components/schemas/APIError"
                }
              }
            }
          },
          "415": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "./../common/transport.yaml#/components/schemas/APIError"
                }
              }
            }
          },
          "503": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "./../common/transport.yaml#/components/schemas/APIError"
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "Repository": {
        "type": "object",
        "required": [
          "id",
          "ownerType",
          "ownerId",
          "name",
          "status",
          "createdAt",
          "updatedAt",
          "version"
        ],
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^[a-f0-9]{32}$"
          },
          "ownerId": {
            "type": "string",
            "description": "User ID for USER owners or UUID for ORGANIZATION owners"
          },
          "ownerType": {
            "type": "string",
            "enum": [
              "USER",
              "ORGANIZATION"
            ]
          },
          "groupId": {
            "type": "string",
            "pattern": "^C[a-f0-9]{32}$",
            "description": "Optional read projection from the authoritative LINE interaction binding. It is not repository state, the owner, or an authorization grant."
          },
          "name": {
            "type": "string"
          },
          "status": {
            "type": "string",
            "enum": [
              "ACTIVE",
              "INACTIVE"
            ]
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          },
          "updatedAt": {
            "type": "string",
            "format": "date-time"
          },
          "version": {
            "type": "integer",
            "format": "int64",
            "minimum": 1
          },
          "address": {
            "$ref": "#/components/schemas/RepositoryAddress"
          }
        }
      },
      "RepositoryAddress": {
        "type": "object",
        "required": [
          "countryCode",
          "postalCode",
          "addressLine"
        ],
        "properties": {
          "countryCode": {
            "type": "string",
            "pattern": "^[A-Z]{2}$"
          },
          "postalCode": {
            "type": "string",
            "maxLength": 32
          },
          "addressLine": {
            "type": "string",
            "minLength": 1,
            "maxLength": 500
          }
        }
      },
      "RepositoryAddressUpdate": {
        "type": "object",
        "required": [
          "address",
          "expectedVersion"
        ],
        "properties": {
          "address": {
            "$ref": "#/components/schemas/RepositoryAddress"
          },
          "expectedVersion": {
            "type": "integer",
            "format": "int64",
            "minimum": 1
          }
        }
      },
      "RepositoryPage": {
        "type": "object",
        "required": [
          "items",
          "nextCursor"
        ],
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Repository"
            }
          },
          "nextCursor": {
            "type": "string",
            "description": "Empty when finished. Pages may be empty after current-membership filtering."
          }
        }
      }
    }
  }
}
