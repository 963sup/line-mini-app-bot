{
  "paths": {
    "/api/v1/repositories/{repositoryId}/spaces": {
      "get": {
        "operationId": "listRepositorySpaces",
        "summary": "Read repository-owned business spaces as a current repository member",
        "security": [
          {
            "bearerAuth": []
          },
          {
            "sessionCookie": []
          }
        ],
        "parameters": [
          {
            "in": "path",
            "name": "repositoryId",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            }
          },
          {
            "in": "query",
            "name": "cursor",
            "schema": {
              "type": "string",
              "maxLength": 1024
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Authorized result; no-store",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/RepositorySpacePage"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/RepositorySpaceError"
          },
          "401": {
            "$ref": "#/components/responses/RepositorySpaceError"
          },
          "403": {
            "$ref": "#/components/responses/RepositorySpaceError"
          },
          "404": {
            "$ref": "#/components/responses/RepositorySpaceError"
          },
          "409": {
            "$ref": "#/components/responses/RepositorySpaceError"
          },
          "415": {
            "$ref": "#/components/responses/RepositorySpaceError"
          },
          "503": {
            "$ref": "#/components/responses/RepositorySpaceError"
          }
        }
      },
      "post": {
        "operationId": "createRepositorySpace",
        "summary": "Create a repository-owned business space using a scoped idempotency key",
        "security": [
          {
            "bearerAuth": []
          },
          {
            "sessionCookie": []
          }
        ],
        "parameters": [
          {
            "in": "path",
            "name": "repositoryId",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            }
          },
          {
            "in": "header",
            "name": "Idempotency-Key",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[A-Za-z0-9_-]{16,128}$"
            },
            "description": "Scoped to actor and repository within Object creation only. Reuse the original key after an unknown result; same key with different normalized content conflicts."
          },
          {
            "in": "header",
            "name": "X-CSRF-Token",
            "schema": {
              "type": "string"
            },
            "description": "Required for Cookie Session writes; validated by the existing session authenticator."
          }
        ],
        "responses": {
          "200": {
            "description": "Authorized result; no-store",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/RepositorySpace"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/RepositorySpaceError"
          },
          "401": {
            "$ref": "#/components/responses/RepositorySpaceError"
          },
          "403": {
            "$ref": "#/components/responses/RepositorySpaceError"
          },
          "404": {
            "$ref": "#/components/responses/RepositorySpaceError"
          },
          "409": {
            "$ref": "#/components/responses/RepositorySpaceError"
          },
          "415": {
            "$ref": "#/components/responses/RepositorySpaceError"
          },
          "503": {
            "$ref": "#/components/responses/RepositorySpaceError"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/RepositorySpaceCreation"
              }
            }
          }
        }
      }
    },
    "/api/v1/repositories/{repositoryId}/spaces/{id}": {
      "get": {
        "operationId": "getRepositorySpace",
        "summary": "Read repository-owned business spaces as a current repository member",
        "security": [
          {
            "bearerAuth": []
          },
          {
            "sessionCookie": []
          }
        ],
        "parameters": [
          {
            "in": "path",
            "name": "repositoryId",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            }
          },
          {
            "in": "path",
            "name": "id",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Authorized result; no-store",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/RepositorySpace"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/RepositorySpaceError"
          },
          "401": {
            "$ref": "#/components/responses/RepositorySpaceError"
          },
          "403": {
            "$ref": "#/components/responses/RepositorySpaceError"
          },
          "404": {
            "$ref": "#/components/responses/RepositorySpaceError"
          },
          "409": {
            "$ref": "#/components/responses/RepositorySpaceError"
          },
          "415": {
            "$ref": "#/components/responses/RepositorySpaceError"
          },
          "503": {
            "$ref": "#/components/responses/RepositorySpaceError"
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "RepositorySpace": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "repositoryId",
          "name",
          "creatorId",
          "version",
          "createdAt",
          "updatedAt"
        ],
        "properties": {
          "name": {
            "type": "string",
            "maxLength": 120,
            "minLength": 1
          },
          "id": {
            "type": "string",
            "pattern": "^[a-f0-9]{32}$"
          },
          "repositoryId": {
            "type": "string",
            "pattern": "^[a-f0-9]{32}$"
          },
          "creatorId": {
            "type": "string"
          },
          "version": {
            "type": "integer",
            "format": "int64",
            "minimum": 1,
            "maximum": 9007199254740991
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          },
          "updatedAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "RepositorySpaceCreation": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "name"
        ],
        "properties": {
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          }
        }
      },
      "RepositorySpacePage": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "items",
          "nextCursor"
        ],
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/RepositorySpace"
            }
          },
          "nextCursor": {
            "type": "string",
            "description": "Empty when finished; at most twenty objects per page in document-ID ascending order."
          }
        }
      }
    },
    "responses": {
      "RepositorySpaceError": {
        "description": "Request rejected or unavailable; errors never expose hidden resources.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "../common/transport.yaml#/components/schemas/APIError"
            }
          }
        }
      }
    }
  }
}
