            "type": "string",
            "maxLength": 32000
          }
        },
        "required": [
          "title",
          "body"
        ]
      },
      "WikiUpdate": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "title": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "body": {
            "type": "string",
            "maxLength": 32000
          },
          "expectedVersion": {
            "type": "integer",
            "format": "int64",
            "minimum": 1,
            "maximum": 9007199254740991
          }
        },
        "required": [
          "title",
          "body",
          "expectedVersion"
        ]
      },
      "WikiDirectory": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "items": {
            "type": "array",
