{
  "paths": {
    "/api/v1/spaces": {
      "get": {
        "operationId": "listSpaces",
        "summary": "Independent Space membership and lifecycle, not Repository ownership",
        "security": [
          {
            "bearerAuth": []
          },
          {
            "sessionCookie": []
          }
        ],
        "parameters": [
          {
            "in": "query",
            "name": "cursor",
            "schema": {
              "type": "string",
              "maxLength": 1024
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Authorized repository data; no-store",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SpacePage"
                }
              }
            }
          },
          "400": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "./../common/transport.yaml#/components/schemas/APIError"
                }
              }
            }
          },
          "401": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "./../common/transport.yaml#/components/schemas/APIError"
                }
              }
            }
          },
          "404": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "./../common/transport.yaml#/components/schemas/APIError"
                }
              }
            }
          },
          "503": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "./../common/transport.yaml#/components/schemas/APIError"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/spaces/{id}": {
      "get": {
        "operationId": "getSpace",
        "summary": "Independent Space membership and lifecycle, not Repository ownership",
        "security": [
          {
            "bearerAuth": []
          },
          {
            "sessionCookie": []
          }
        ],
        "parameters": [
          {
            "in": "path",
            "name": "id",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^C[a-f0-9]{32}$"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Authorized repository data; no-store",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Space"
                }
              }
            }
          },
          "400": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "./../common/transport.yaml#/components/schemas/APIError"
                }
              }
            }
          },
          "401": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "./../common/transport.yaml#/components/schemas/APIError"
                }
              }
            }
          },
          "404": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "./../common/transport.yaml#/components/schemas/APIError"
                }
              }
            }
          },
          "503": {
            "description": "Request failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "./../common/transport.yaml#/components/schemas/APIError"
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "Space": {
        "type": "object",
        "required": [
          "id",
          "groupId",
          "name",
          "status",
          "createdAt",
          "updatedAt",
          "version"
        ],
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^C[a-f0-9]{32}$"
          },
          "groupId": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "status": {
            "type": "string",
            "enum": [
              "ACTIVE",
              "INACTIVE"
            ]
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          },
          "updatedAt": {
            "type": "string",
            "format": "date-time"
          },
          "version": {
            "type": "integer",
            "format": "int64",
            "minimum": 1
          }
        }
      },
      "SpacePage": {
        "type": "object",
        "required": [
          "items",
          "nextCursor"
        ],
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Space"
            }
          },
          "nextCursor": {
            "type": "string",
            "description": "Empty when finished. Pages may be empty after current-membership filtering."
          }
        }
      }
    }
  }
}
