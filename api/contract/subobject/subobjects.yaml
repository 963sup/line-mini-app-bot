{
  "x-owner": "subobject",
  "paths": {
    "/api/v1/repositories/{repositoryId}/objects/{objectId}/subobjects": {
      "get": {
        "operationId": "listSubobjects",
        "summary": "Read repository member-accessible child data",
        "security": [
          {
            "bearerAuth": []
          },
          {
            "sessionCookie": []
          }
        ],
        "parameters": [
          {
            "in": "path",
            "name": "repositoryId",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            }
          },
          {
            "in": "path",
            "name": "objectId",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            }
          },
          {
            "in": "query",
            "name": "cursor",
            "schema": {
              "type": "string",
              "maxLength": 1024
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Authorized result; no-store",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SubobjectPage"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/SubobjectError"
          },
          "401": {
            "$ref": "#/components/responses/SubobjectError"
          },
          "403": {
            "$ref": "#/components/responses/SubobjectError"
          },
          "404": {
            "$ref": "#/components/responses/SubobjectError"
          },
          "409": {
            "$ref": "#/components/responses/SubobjectError"
          },
          "415": {
            "$ref": "#/components/responses/SubobjectError"
          },
          "503": {
            "$ref": "#/components/responses/SubobjectError"
          }
        }
      },
      "post": {
        "operationId": "createSubobject",
        "summary": "Create one child as parent owner without changing parent progress",
        "security": [
          {
            "bearerAuth": []
          },
          {
            "sessionCookie": []
          }
        ],
        "parameters": [
          {
            "in": "path",
            "name": "repositoryId",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            }
          },
          {
            "in": "path",
            "name": "objectId",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            }
          },
          {
            "in": "header",
            "name": "Idempotency-Key",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[A-Za-z0-9_-]{16,128}$"
            },
            "description": "Scoped to actor and repository within Object creation only. Reuse the original key after an unknown result; same key with different normalized content conflicts."
          },
          {
            "in": "header",
            "name": "X-CSRF-Token",
            "schema": {
              "type": "string"
            },
            "description": "Required for Cookie Session writes; validated by the existing session authenticator."
          }
        ],
        "responses": {
          "200": {
            "description": "Authorized result; no-store",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Subobject"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/SubobjectError"
          },
          "401": {
            "$ref": "#/components/responses/SubobjectError"
          },
          "403": {
            "$ref": "#/components/responses/SubobjectError"
          },
          "404": {
            "$ref": "#/components/responses/SubobjectError"
          },
          "409": {
            "$ref": "#/components/responses/SubobjectError"
          },
          "415": {
            "$ref": "#/components/responses/SubobjectError"
          },
          "503": {
            "$ref": "#/components/responses/SubobjectError"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/SubobjectCreation"
              }
            }
          }
        }
      }
    },
    "/api/v1/repositories/{repositoryId}/objects/{objectId}/subobjects/{id}": {
      "get": {
        "operationId": "getSubobject",
        "summary": "Read repository member-accessible child data",
        "security": [
          {
            "bearerAuth": []
          },
          {
            "sessionCookie": []
          }
        ],
        "parameters": [
          {
            "in": "path",
            "name": "repositoryId",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            }
          },
          {
            "in": "path",
            "name": "objectId",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            }
          },
          {
            "in": "path",
            "name": "id",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Authorized result; no-store",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Subobject"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/SubobjectError"
          },
          "401": {
            "$ref": "#/components/responses/SubobjectError"
          },
          "403": {
            "$ref": "#/components/responses/SubobjectError"
          },
          "404": {
            "$ref": "#/components/responses/SubobjectError"
          },
          "409": {
            "$ref": "#/components/responses/SubobjectError"
          },
          "415": {
            "$ref": "#/components/responses/SubobjectError"
          },
          "503": {
            "$ref": "#/components/responses/SubobjectError"
          }
        }
      },
      "patch": {
        "operationId": "updateSubobject",
        "summary": "Update child as current parent owner with expected version",
        "security": [
          {
            "bearerAuth": []
          },
          {
            "sessionCookie": []
          }
        ],
        "parameters": [
          {
            "in": "path",
            "name": "repositoryId",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            }
          },
          {
            "in": "path",
            "name": "objectId",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            }
          },
          {
            "in": "path",
            "name": "id",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{32}$"
            }
          },
          {
            "in": "header",
            "name": "X-CSRF-Token",
            "schema": {
              "type": "string"
            },
            "description": "Required for Cookie Session writes; validated by the existing session authenticator."
          }
        ],
        "responses": {
          "200": {
            "description": "Authorized result; no-store",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Subobject"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/SubobjectError"
          },
          "401": {
            "$ref": "#/components/responses/SubobjectError"
          },
          "403": {
            "$ref": "#/components/responses/SubobjectError"
          },
          "404": {
            "$ref": "#/components/responses/SubobjectError"
          },
          "409": {
            "$ref": "#/components/responses/SubobjectError"
          },
          "415": {
            "$ref": "#/components/responses/SubobjectError"
          },
          "503": {
            "$ref": "#/components/responses/SubobjectError"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/SubobjectUpdate"
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "Subobject": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "name",
          "type",
          "unit",
          "quantity",
          "id",
          "repositoryId",
          "creatorId",
          "version",
          "createdAt",
          "updatedAt",
          "status",
          "parentObjectId"
        ],
        "properties": {
          "name": {
            "type": "string",
            "maxLength": 120,
            "minLength": 1
          },
          "type": {
            "type": "string",
            "enum": [
              "work",
              "non_work"
            ]
          },
          "unit": {
            "type": "string",
            "maxLength": 32,
            "minLength": 1
          },
          "quantity": {
            "type": "string",
            "maxLength": 25,
            "pattern": "^(0|[1-9][0-9]{0,17})(\\.[0-9]{1,6})?$",
            "description": "Positive exact decimal; zero rejected. Server strips trailing fractional zeroes; no exponent or float conversion."
          },
          "id": {
            "type": "string",
            "pattern": "^[a-f0-9]{32}$"
          },
          "repositoryId": {
            "type": "string",
            "pattern": "^[a-f0-9]{32}$"
          },
          "creatorId": {
            "type": "string"
          },
          "version": {
            "type": "integer",
            "format": "int64",
            "minimum": 1,
            "maximum": 9007199254740991
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          },
          "updatedAt": {
            "type": "string",
            "format": "date-time"
          },
          "status": {
            "type": "string",
            "enum": [
              "not_started",
              "in_progress",
              "completed"
            ],
            "description": "Derived from completedQuantity for managed work. For non_work this technical three-state value is retained only for compatibility; UI displays not applicable. Legacy records without progress retain their original status."
          },
          "completedQuantity": {
            "type": "string",
            "maxLength": 25,
            "pattern": "^(0|[1-9][0-9]{0,17})(\\.[0-9]{1,6})?$",
            "description": "Exact completed quantity for work; defaults to 0 on create, omission preserves on update. Non-work has no completed quantity; conversion to work requires explicit quantity."
          },
          "parentObjectId": {
            "type": "string",
            "pattern": "^[a-f0-9]{32}$"
          }
        }
      },
      "SubobjectCreation": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "name",
          "type",
          "quantity",
          "unit"
        ],
        "properties": {
          "name": {
            "type": "string",
            "maxLength": 120,
            "minLength": 1
          },
          "type": {
            "type": "string",
            "enum": [
              "work",
              "non_work"
            ]
          },
          "unit": {
            "type": "string",
            "maxLength": 32,
            "minLength": 1
          },
          "quantity": {
            "type": "string",
            "maxLength": 25,
            "pattern": "^(0|[1-9][0-9]{0,17})(\\.[0-9]{1,6})?$",
            "description": "Positive exact decimal; zero rejected. Server strips trailing fractional zeroes; no exponent or float conversion."
          },
          "completedQuantity": {
            "type": "string",
            "maxLength": 25,
            "pattern": "^(0|[1-9][0-9]{0,17})(\\.[0-9]{1,6})?$",
            "description": "Exact completed quantity for work; defaults to 0 on create, omission preserves on update. Non-work has no completed quantity; conversion to work requires explicit quantity."
          }
        }
      },
      "SubobjectUpdate": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "name",
          "type",
          "quantity",
          "unit",
          "expectedVersion"
        ],
        "properties": {
          "name": {
            "type": "string",
            "maxLength": 120,
            "minLength": 1
          },
          "type": {
            "type": "string",
            "enum": [
              "work",
              "non_work"
            ]
          },
          "unit": {
            "type": "string",
            "maxLength": 32,
            "minLength": 1
          },
          "quantity": {
            "type": "string",
            "maxLength": 25,
            "pattern": "^(0|[1-9][0-9]{0,17})(\\.[0-9]{1,6})?$",
            "description": "Positive exact decimal; zero rejected. Server strips trailing fractional zeroes; no exponent or float conversion."
          },
          "expectedVersion": {
            "type": "integer",
            "format": "int64",
            "minimum": 1,
            "maximum": 9007199254740991
          },
          "completedQuantity": {
            "type": "string",
            "maxLength": 25,
            "pattern": "^(0|[1-9][0-9]{0,17})(\\.[0-9]{1,6})?$",
            "description": "Exact completed quantity for work; defaults to 0 on create, omission preserves on update. Non-work has no completed quantity; conversion to work requires explicit quantity."
          }
        }
      },
      "SubobjectPage": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "items",
          "nextCursor"
        ],
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Subobject"
            }
          },
          "nextCursor": {
            "type": "string",
            "description": "Empty when finished; at most twenty objects per page in document-ID ascending order."
          }
        }
      }
    },
    "responses": {
      "SubobjectError": {
        "description": "Rejected or unavailable. Writes require current parent ownership; parent progress is never changed. Retry creates with the original key and body.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "../common/transport.yaml#/components/schemas/APIError"
            }
          }
        }
      }
    }
  }
}
