          }
        }
      },
      "OrganizationTeamsResponse": {
        "type": "object",
        "required": [
          "teams",
          "canBindTeam"
        ],
        "properties": {
          "canBindTeam": {
            "type": "boolean",
            "description": "Whether the actor may request legacy binding to this organization. The write also checks the selected group."
          },
          "teams": {
            "type": "array",
            "items": {
