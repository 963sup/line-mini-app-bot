<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>群組定位打卡</title>
  <link rel="stylesheet" href="/assets/miniapp.css">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js" defer></script>
  <script src="/assets/miniapp.js" defer></script>
  <script src="/assets/attendance.js" defer></script>
</head>
<body class="app-page">
  <main class="app-shell">
    <header class="app-hero"><p class="eyebrow">LINE 出勤服務</p><h1>群組定位打卡</h1></header>
    <section class="panel">
      <h2>確認身分</h2>
      <p id="mini-status" role="status" aria-live="polite">正在準備登入……</p>
      <div class="actions">
        <button id="login" type="button" hidden>使用 LINE 登入</button>
        <button id="verify" type="button" hidden>重新驗證身分</button>
        <button id="logout" type="button" hidden>登出此頁</button>
      </div>
      <dl id="identity" hidden>
        <div><dt>LINE 名稱</dt><dd id="display-name"></dd></div>
        <div><dt>本人 ID</dt><dd id="user-id"></dd></div>
      </dl>
    </section>
    <section id="attendance" class="panel accent-panel" hidden>
      <h2>取得位置並完成打卡</h2>
      <p>請允許定位。取得位置後將保存本次打卡的位置、精度與採樣時間。</p>
      <button id="punch" type="button">取得位置並完成打卡</button>
      <p id="punch-status" role="status" aria-live="polite"></p>
    </section>
    <noscript>請啟用 JavaScript，以使用 LINE 登入及定位打卡。</noscript>
  </main>
</body>
</html>
