{{define "correction"}}<section class="panel">
  <h2>提出更正</h2>
  <p><a id="back-history" href="/miniapp/history">回本人月紀錄選擇班次</a></p>
  <p id="record-description" class="hint">請先從月紀錄選擇要更正的班次。</p>
  <form id="correction-form"><fieldset id="correction-fields" disabled>
    <div class="field-grid"><label>上班時間<input id="correction-start" type="datetime-local" step="1" required></label><label>下班時間<input id="correction-end" type="datetime-local" step="1" required></label></div>
    <fieldset><legend>實際休息區間</legend><div id="correction-breaks"></div><button id="add-break" type="button" class="secondary">新增休息區間</button></fieldset>
    <label>更正原因<textarea id="correction-reason" required maxlength="500"></textarea></label>
    <label class="check-row"><input id="correction-confirm" type="checkbox" required>已確認實際工作與休息時間；沒有休息區間代表本班無可扣除的休息。</label>
    <button id="submit-correction" type="submit">送出更正申請</button>
  </fieldset></form>
  <p id="correction-status" role="status" aria-live="polite">請先完成身分驗證。</p>
</section><section class="panel">
  <h2>查看申請結果</h2><p class="hint">輸入送出申請時取得的編號；核准前工時不變。</p>
  <fieldset id="status-controls" disabled><label>申請編號<input id="correction-id" type="text" maxlength="128" autocomplete="off"></label><button id="check-correction" type="button">查詢本人申請</button></fieldset>
  <p id="application-status" role="status" aria-live="polite"></p>
</section><script type="module" src="/assets/correction.js"></script>{{end}}
