# Manual/custom-trigger deployment configuration. The current GitHub managed
# trigger uses an inline build with Dockerfile and does not execute this file.
# Runtime credentials are Secret Manager references, never build substitutions.
steps:
  - id: validate-settings
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:592.0.0-slim
    entrypoint: bash
    env:
      - 'LINE_MESSAGING_API_CHANNEL_ID=${_MESSAGING_API_CHANNEL_ID}'
      - 'LINE_MINI_APP_ENV=${_MINI_APP_ENV}'
      - 'LINE_MINI_APP_DEVELOPING_CHANNEL_ID=${_MINI_APP_DEVELOPING_CHANNEL_ID}'
      - 'LINE_MINI_APP_DEVELOPING_LIFF_ID=${_MINI_APP_DEVELOPING_LIFF_ID}'
      - 'LINE_MINI_APP_DEVELOPING_ENDPOINT_URL=${_MINI_APP_DEVELOPING_ENDPOINT_URL}'
      - 'LINE_MINI_APP_REVIEW_CHANNEL_ID=${_MINI_APP_REVIEW_CHANNEL_ID}'
      - 'LINE_MINI_APP_REVIEW_LIFF_ID=${_MINI_APP_REVIEW_LIFF_ID}'
      - 'LINE_MINI_APP_REVIEW_ENDPOINT_URL=${_MINI_APP_REVIEW_ENDPOINT_URL}'
      - 'LINE_MINI_APP_PUBLISHED_CHANNEL_ID=${_MINI_APP_PUBLISHED_CHANNEL_ID}'
      - 'LINE_MINI_APP_PUBLISHED_LIFF_ID=${_MINI_APP_PUBLISHED_LIFF_ID}'
      - 'LINE_MINI_APP_PUBLISHED_ENDPOINT_URL=${_MINI_APP_PUBLISHED_ENDPOINT_URL}'
      - 'SECRET_VERSION=${_CHANNEL_SECRET_VERSION}'
      - 'TOKEN_VERSION=${_CHANNEL_ACCESS_TOKEN_VERSION}'
    args:
      - -ceu
      - |
        [[ "$${LINE_MESSAGING_API_CHANNEL_ID}" =~ ^[0-9]+$ ]] || {
          echo 'Set _MESSAGING_API_CHANNEL_ID to the Messaging API Channel ID.' >&2; exit 2;
        }
        case "$${LINE_MINI_APP_ENV}" in
          developing|review|published) ;;
          *) echo 'Set _MINI_APP_ENV to developing, review or published.' >&2; exit 2 ;;
        esac
        prefix="LINE_MINI_APP_$${LINE_MINI_APP_ENV^^}_"
        channel_key="$${prefix}CHANNEL_ID"
        liff_key="$${prefix}LIFF_ID"
        endpoint_key="$${prefix}ENDPOINT_URL"
        [[ "$${!channel_key}" =~ ^[0-9]+$ && "$${!liff_key}" == "$${!channel_key}-"?* && -n "$${!endpoint_key}" ]] || {
          echo 'Set the selected MINI App Channel ID, matching LIFF ID and Endpoint URL.' >&2; exit 2;
        }
        [[ "$${SECRET_VERSION}" =~ ^[1-9][0-9]*$ ]] &&
        [[ "$${TOKEN_VERSION}" =~ ^[1-9][0-9]*$ ]] || {
          echo 'Secret versions must be positive version numbers, not latest.' >&2; exit 2;
        }

  - id: build
    name: gcr.io/cloud-builders/docker
    env:
      - 'DOCKER_BUILDKIT=1'
    args:
      - build
      - --build-arg
      - VCS_REF=$COMMIT_SHA
      - --tag
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_SERVICE}:$BUILD_ID'
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_SERVICE}:$BUILD_ID'

  - id: attendance-indexes
    name: python:3.12-slim
    entrypoint: python3
    args: ["scripts/tooling/ensure-attendance-indexes.py", "$PROJECT_ID"]

  # A separate job publishes once per build, before exposing the new service.
  # Each build has its own immutable job template; channel publications share a lease.
  - id: sync-line-navigation
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:592.0.0-slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - '${_SERVICE}-nav-$BUILD_ID'
      - '--project=$PROJECT_ID'
      - '--region=${_REGION}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_SERVICE}:$BUILD_ID'
      - '--service-account=${_RUNTIME_SERVICE_ACCOUNT}@$PROJECT_ID.iam.gserviceaccount.com'
      - --command=/server
      - --args=sync-line-navigation
      - --tasks=1
      - --parallelism=1
      - --max-retries=1
      - --task-timeout=600s
      - --cpu=1
      - --memory=512Mi
      - '--set-env-vars=^|^GOOGLE_CLOUD_PROJECT=$PROJECT_ID|LINE_MESSAGING_API_CHANNEL_ID=${_MESSAGING_API_CHANNEL_ID}|LINE_MINI_APP_ENV=${_MINI_APP_ENV}|LINE_MINI_APP_DEVELOPING_CHANNEL_ID=${_MINI_APP_DEVELOPING_CHANNEL_ID}|LINE_MINI_APP_DEVELOPING_LIFF_ID=${_MINI_APP_DEVELOPING_LIFF_ID}|LINE_MINI_APP_DEVELOPING_ENDPOINT_URL=${_MINI_APP_DEVELOPING_ENDPOINT_URL}|LINE_MINI_APP_REVIEW_CHANNEL_ID=${_MINI_APP_REVIEW_CHANNEL_ID}|LINE_MINI_APP_REVIEW_LIFF_ID=${_MINI_APP_REVIEW_LIFF_ID}|LINE_MINI_APP_REVIEW_ENDPOINT_URL=${_MINI_APP_REVIEW_ENDPOINT_URL}|LINE_MINI_APP_PUBLISHED_CHANNEL_ID=${_MINI_APP_PUBLISHED_CHANNEL_ID}|LINE_MINI_APP_PUBLISHED_LIFF_ID=${_MINI_APP_PUBLISHED_LIFF_ID}|LINE_MINI_APP_PUBLISHED_ENDPOINT_URL=${_MINI_APP_PUBLISHED_ENDPOINT_URL}'
      - '--set-secrets=LINE_MESSAGING_API_CHANNEL_ACCESS_TOKEN=${_CHANNEL_ACCESS_TOKEN_NAME}:${_CHANNEL_ACCESS_TOKEN_VERSION}'
      - --execute-now
      - --wait
      - --quiet

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:592.0.0-slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '${_SERVICE}'
      - '--project=$PROJECT_ID'
      - '--region=${_REGION}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_SERVICE}:$BUILD_ID'
      - '--service-account=${_RUNTIME_SERVICE_ACCOUNT}@$PROJECT_ID.iam.gserviceaccount.com'
      - --allow-unauthenticated
      - --ingress=all
      - --port=8080
      - --startup-probe=tcpSocket.port=8080
      - --cpu=1
      - --memory=512Mi
      - --min=0
      - --max=3
      - --concurrency=20
      - --timeout=100s
      - --deploy-health-check
      - '--set-env-vars=^|^GOOGLE_CLOUD_PROJECT=$PROJECT_ID|LINE_MESSAGING_API_CHANNEL_ID=${_MESSAGING_API_CHANNEL_ID}|LINE_MINI_APP_ENV=${_MINI_APP_ENV}|LINE_MINI_APP_DEVELOPING_CHANNEL_ID=${_MINI_APP_DEVELOPING_CHANNEL_ID}|LINE_MINI_APP_DEVELOPING_LIFF_ID=${_MINI_APP_DEVELOPING_LIFF_ID}|LINE_MINI_APP_DEVELOPING_ENDPOINT_URL=${_MINI_APP_DEVELOPING_ENDPOINT_URL}|LINE_MINI_APP_REVIEW_CHANNEL_ID=${_MINI_APP_REVIEW_CHANNEL_ID}|LINE_MINI_APP_REVIEW_LIFF_ID=${_MINI_APP_REVIEW_LIFF_ID}|LINE_MINI_APP_REVIEW_ENDPOINT_URL=${_MINI_APP_REVIEW_ENDPOINT_URL}|LINE_MINI_APP_PUBLISHED_CHANNEL_ID=${_MINI_APP_PUBLISHED_CHANNEL_ID}|LINE_MINI_APP_PUBLISHED_LIFF_ID=${_MINI_APP_PUBLISHED_LIFF_ID}|LINE_MINI_APP_PUBLISHED_ENDPOINT_URL=${_MINI_APP_PUBLISHED_ENDPOINT_URL}|AI_DOCUMENT_MODEL=gpt-4.1-mini|SUMMARY_PROVIDER=${_SUMMARY_PROVIDER}|SUMMARY_MODEL=${_SUMMARY_MODEL}|SUMMARY_TASK_QUEUE=${_SUMMARY_TASK_QUEUE}|SUMMARY_TASK_URL=${_SUMMARY_TASK_URL}|SUMMARY_TASK_SERVICE_ACCOUNT=${_SUMMARY_TASK_SERVICE_ACCOUNT}|LINE_MENU_STICKER_PACKAGE_ID=${_MENU_STICKER_PACKAGE_ID}|LINE_MENU_STICKER_ID=${_MENU_STICKER_ID}'
      - '--set-secrets=LINE_MINI_APP_CHANNEL_SECRET=line_mini_app_channel_secret:${_MINI_APP_CHANNEL_SECRET_VERSION},LINE_MESSAGING_API_CHANNEL_SECRET=${_CHANNEL_SECRET_NAME}:${_CHANNEL_SECRET_VERSION},LINE_MESSAGING_API_CHANNEL_ACCESS_TOKEN=${_CHANNEL_ACCESS_TOKEN_NAME}:${_CHANNEL_ACCESS_TOKEN_VERSION},GEMINI_API_KEY=gemini-api-key:${_GEMINI_API_KEY_VERSION},OPENAI_API_KEY=openai-api-key:${_OPENAI_API_KEY_VERSION},CWA_API_KEY=cwa-api-key:${_CWA_API_KEY_VERSION}'
      - --quiet

  - id: remove-completed-navigation-job
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:592.0.0-slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - delete
      - '${_SERVICE}-nav-$BUILD_ID'
      - '--project=$PROJECT_ID'
      - '--region=${_REGION}'
      - --quiet

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_SERVICE}:$BUILD_ID'

serviceAccount: 'projects/$PROJECT_ID/serviceAccounts/${_BUILD_SERVICE_ACCOUNT}@$PROJECT_ID.iam.gserviceaccount.com'

substitutions:
  _SERVICE: line-mini-app-bot
  _MENU_STICKER_PACKAGE_ID: '14852806'
  _MENU_STICKER_ID: '388289150'
  _REGION: asia-east1
  _ARTIFACT_REPOSITORY: applications
  _BUILD_SERVICE_ACCOUNT: cloud-build-deployer
  _RUNTIME_SERVICE_ACCOUNT: line-mini-app-runtime
  # Messaging API Channel ID; submission/trigger substitutions may override it.
  _MESSAGING_API_CHANNEL_ID: '2012305727'
  # Public runtime configuration; override these examples for your own MINI App.
  _MINI_APP_ENV: developing
  _MINI_APP_DEVELOPING_CHANNEL_ID: '2012412007'
  _MINI_APP_DEVELOPING_LIFF_ID: '2012412007-0xCIzCmZ'
  _MINI_APP_DEVELOPING_ENDPOINT_URL: 'https://line-mini-app-bot-jtghegqd7q-de.a.run.app/miniapp'
  _MINI_APP_REVIEW_CHANNEL_ID: '2012412008'
  _MINI_APP_REVIEW_LIFF_ID: '2012412008-L7dYhvM1'
  _MINI_APP_REVIEW_ENDPOINT_URL: 'https://line-mini-app-bot-jtghegqd7q-de.a.run.app/miniapp'
  _MINI_APP_PUBLISHED_CHANNEL_ID: '2012412009'
  _MINI_APP_PUBLISHED_LIFF_ID: '2012412009-Xp2CQWOP'
  _MINI_APP_PUBLISHED_ENDPOINT_URL: 'https://line-mini-app-bot-jtghegqd7q-de.a.run.app/miniapp'
  # Reserved runtime binding; the current MINI App flow does not read this secret.
  _MINI_APP_CHANNEL_SECRET_VERSION: '1'
  _CHANNEL_SECRET_NAME: line-messaging-api-channel-secret
  _CHANNEL_SECRET_VERSION: '3'
  _CHANNEL_ACCESS_TOKEN_NAME: line-messaging-api-channel-access-token
  _CHANNEL_ACCESS_TOKEN_VERSION: '2'
  # Configure the provider, matching model and all three task settings together.
  _SUMMARY_PROVIDER: 'openai'
  _SUMMARY_MODEL: 'gpt-4.1-mini'
  _SUMMARY_TASK_QUEUE: 'projects/bubbly-area-513305-s0/locations/asia-east1/queues/line-summary-tasks'
  _SUMMARY_TASK_URL: 'https://line-mini-app-bot-jtghegqd7q-de.a.run.app/internal/summary'
  _SUMMARY_TASK_SERVICE_ACCOUNT: 'line-summary-task@bubbly-area-513305-s0.iam.gserviceaccount.com'
  _GEMINI_API_KEY_VERSION: 'latest'
  _OPENAI_API_KEY_VERSION: '1'
  _CWA_API_KEY_VERSION: '1'

options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true

timeout: 2400s
