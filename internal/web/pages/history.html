{{define "history"}}<section class="panel" id="history">
  <h2>本人月紀錄</h2>
  <p class="hint">整月摘要與下方分頁明細分開計算。資料可能更新；更正後請重新查詢。</p>
  <fieldset id="history-controls" disabled>
    <div class="actions"><button id="load-groups" type="button">載入本人群組</button><button id="more-groups" class="secondary" type="button" hidden>載入更多群組</button></div>
    <div class="field-grid"><label>群組<select id="history-group"><option value="">請先載入群組</option></select></label><label>月份<input id="history-month" type="month" required></label></div>
    <button id="load-month" type="button">查詢月紀錄</button>
  </fieldset>
  <p id="history-status" role="status" aria-live="polite">請先完成身分驗證。</p>
  <pre id="month-summary" class="summary"></pre>
  <ol id="record-list" class="record-list" aria-label="班次明細"></ol>
  <div class="actions"><button id="previous-records" class="secondary" type="button" disabled>上一頁</button><span id="record-page" aria-live="polite"></span><button id="next-records" class="secondary" type="button" disabled>下一頁</button></div>
</section><script type="module" src="/assets/history.js"></script>{{end}}
