min_version = "2026.11.3"

[env]
# Non-secret development configuration; also loaded before mise starts.
XDG_CACHE_HOME = "/workspace/tooling/cache"
XDG_CONFIG_HOME = "/workspace/tooling/config"
XDG_DATA_HOME = "/workspace/tooling/data"
XDG_STATE_HOME = "/workspace/tooling/state"
XDG_RUNTIME_DIR = "/workspace/tooling/runtime"
TMPDIR = "/workspace/tooling/tmp"
MISE_DATA_DIR = "/workspace/tooling/mise-data"
MISE_CACHE_DIR = "/workspace/tooling/cache/mise"
MISE_STATE_DIR = "/workspace/tooling/state/mise"
MISE_CONFIG_DIR = "/workspace/tooling/config/mise"
MISE_SELF_UPDATE_AVAILABLE = "false"
NEXT_TELEMETRY_DISABLED = "1"
TURBO_TELEMETRY_DISABLED = "1"
GOPATH = "/workspace/tooling/go"
GOCACHE = "/workspace/tooling/cache/go-build"
GOMODCACHE = "/workspace/tooling/go/pkg/mod"
GOENV = "/workspace/tooling/config/go/env"
GOTMPDIR = "/workspace/tooling/tmp/go"
GOTOOLCHAIN = "local"
GOFLAGS = "-mod=readonly"
npm_config_cache = "/workspace/tooling/cache/npm"
npm_config_prefix = "/workspace/tooling/npm"
npm_config_userconfig = "/workspace/tooling/config/npm/npmrc"
UV_CACHE_DIR = "/workspace/tooling/cache/uv"
UV_TOOL_DIR = "/workspace/tooling/data/uv/tools"
UV_TOOL_BIN_DIR = "/workspace/tooling/bin"
UV_PYTHON_DOWNLOADS = "never"
PIP_CACHE_DIR = "/workspace/tooling/cache/pip"
PYTHONPYCACHEPREFIX = "/workspace/tooling/cache/python"
PLAYWRIGHT_BROWSERS_PATH = "/workspace/tooling/cache/ms-playwright"
HISTFILE = "/workspace/tooling/state/bash_history"
CLOUDSDK_CONFIG = "{{ env.CLOUDSDK_CONFIG | default(value=\"/workspace/tooling/config/gcloud\") }}"
GOOGLE_APPLICATION_CREDENTIALS = "{{ env.GOOGLE_APPLICATION_CREDENTIALS | default(value=\"/workspace/tooling/config/gcloud/application_default_credentials.json\") }}"
DOCKER_CONFIG = "{{ env.DOCKER_CONFIG | default(value=\"/workspace/tooling/config/docker\") }}"

[tools]
go = "1.27.4"
# Node includes npm and npx.
node = "24.22.1"
"npm:pnpm" = "12.18.0"
"go:github.com/oasdiff/oasdiff" = "1.37.0"
"go:github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen" = "2.8.2"
"go:golang.org/x/tools/gopls" = "0.24.0"
"go:golang.org/x/tools/cmd/deadcode" = "0.52.0"
"go:golang.org/x/tools/cmd/callgraph" = "0.52.0"
"go:golang.org/x/tools/cmd/stringer" = "0.52.0"
"go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint" = "2.15.0"
"go:mvdan.cc/gofumpt" = "0.12.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
"go:github.com/go-delve/delve/cmd/dlv" = "1.27.2"

uv = "0.13.7"
python = "3.12.14"
"npm:repomix" = "1.18.1"
"npm:shadcn" = "4.23.0"
"npm:skills" = "1.7.6"
gcloud = "592.0.0"
"npm:@google-cloud/gcloud-mcp" = "0.5.3"

[settings]
exec_auto_install = false
task.run_auto_install = false

[tasks.check]
dir = "backend"
run = ["go mod verify", "go vet ./...", "go test -race ./..."]

[tasks.build]
dir = "backend"
run = "go build ./..."

[tasks.graphify-update]
description = "Build a local code graph without LLM calls"
run = "graphify extract /workspace/line-mini-app-bot --code-only --allow-dedup-shrink --out /workspace/line-mini-app-bot"

[tasks.graphify-docs]
description = "Build a separate docs heading/link graph without API credentials"
run = "python3 scripts/analysis/docs-graph.py"

[tasks.install-web]
description = "Install pinned Node and pnpm workspace tooling"
run = "mise install node npm:pnpm go:github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen go:github.com/oasdiff/oasdiff"

[tasks.install-core]
description = "Install pinned Go toolchain and development tools"
run = "mise install go go:golang.org/x/tools/gopls go:golang.org/x/tools/cmd/deadcode go:golang.org/x/tools/cmd/callgraph go:golang.org/x/tools/cmd/stringer go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint go:mvdan.cc/gofumpt go:golang.org/x/vuln/cmd/govulncheck"

[tasks.install-debug]
run = "mise install go:github.com/go-delve/delve/cmd/dlv"

[tasks.fmt]
dir = "backend"
run = "gofumpt -w ."

[tasks.fmt-check]
dir = "backend"
run = 'files="$(gofumpt -l .)"; if [ -n "$files" ]; then printf "%s\n" "$files"; exit 1; fi'

[tasks.lint]
dir = "backend"
run = "golangci-lint run ./..."

[tasks.vuln]
dir = "backend"
run = "govulncheck ./..."

[tasks.deadcode]
dir = "backend"
run = "deadcode ./..."

[tasks.callgraph]
dir = "backend"
run = "callgraph"

[tasks.debug]
dir = "backend"
run = "dlv debug"

[tasks.coverage]
dir = "backend"
run = "mkdir -p .artifacts/go && go test -coverprofile=.artifacts/go/coverage.out ./..."

[tasks.bench]
dir = "backend"
run = "go test -run '^$' -bench . -benchmem ./..."

[tasks.profile]
dir = "backend"
description = "Profile one package: mise run profile ./path/to/package"
run = "bash ../scripts/tooling/go-profile.sh"

[tasks.install-mcp]
description = "Install optional local MCP tools separately from Go"
run = ["mise install node python uv npm:repomix npm:shadcn", "mise run install-graphify"]

[tasks.install-cloud]
description = "Install pinned Google Cloud CLI and local MCP (no authentication or deployment)"
run = "mise install gcloud npm:@google-cloud/gcloud-mcp"

[tasks.doctor-google-knowledge]
description = "Verify Google Developer Knowledge MCP using the host API key"
run = "python3 scripts/tooling/mcp-doctor.py --server google-developer-knowledge"

[tasks.doctor-gcloud]
description = "Verify local gcloud MCP discovery without changing cloud resources"
run = "python3 scripts/tooling/mcp-doctor.py --server gcloud"

[tasks.doctor]
description = "Check local Go and Cloud development prerequisites"
run = "bash scripts/tooling/doctor.sh"

[tasks.dev]
description = "Run the application once cmd/server exists"
run = "bash scripts/tooling/app-task.sh dev"

[tasks.deps]
description = "Download and verify existing module dependencies"
run = "bash scripts/tooling/app-task.sh deps"

[tasks.container-build]
description = "Build locally using the project's Dockerfile"
run = "bash scripts/tooling/app-task.sh container-build"

[tasks.bootstrap]
description = "Prepare Go tools without requiring remote MCP credentials"
run = "bash scripts/tooling/bootstrap.sh core"

[tasks.doctor-mcp]
description = "Verify configured MCP handshakes and tool allowlists (requires network and GitHub token)"
run = "python3 scripts/tooling/mcp-doctor.py"

[tasks.install-graphify]
description = "Install Graphify with uv using the mise Python interpreter"
run = [
  "mise install python uv",
  'uv tool install --python "$(mise which python)" --no-python-downloads "graphifyy[mcp,terraform]==0.9.103"',
  "graphify install --platform codex --project",
  "graphify install --platform agents --project",
]

[tasks.check-config]
description = "Validate repository tooling and agent configuration"
run = "python3 scripts/tooling/check-config.py"

[tasks.repomix]
description = "Pack project sources with security checking and without generated skills"
run = "repomix --style xml --parsable-style --output repomix-output.xml"

[tasks.analysis-scope]
description = "Validate classification of all versioned sources"
run = "python3 scripts/analysis/analysis-scope.py"

[tasks.analysis-audit]
description = "Cross-check Graphify and Repomix against the source contract"
run = "python3 scripts/analysis/analysis-scope.py --audit"

[tasks.docs-openai]
description = "Search official OpenAI docs through MCP; append --arguments JSON to override query"
run = "python3 scripts/tooling/mcp-doctor.py --server openaiDeveloperDocs --call search_openai_docs"

[tasks.doctor-openai]
description = "Check OpenAI Docs MCP independently of optional GitHub credentials"
run = "python3 scripts/tooling/mcp-doctor.py --server openaiDeveloperDocs"

[tasks.install-skills-cli]
description = "Install the pinned skills.sh CLI without adding skills"
run = "mise install node npm:skills"

[tasks.skills-list]
description = "List project skills available to Codex"
run = "skills list --agent codex"
